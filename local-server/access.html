<!doctype html><html lang="uz"><meta charset="utf-8"><title>Xodimlar dostupi</title><style>body{font:16px Aptos,Arial,sans-serif;background:#f2f7f3;color:#20352b;margin:32px}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:12px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #dce7df}select,button,input{font:inherit;padding:8px;border:1px solid #b6cabb;border-radius:6px}button{background:#c3e2cd;cursor:pointer}</style><main><h1>Xodimlar dostupi</h1><p><a href="/">Asosiy oynaga qaytish</a></p><label>Xodim <select id="employee"></select></label><p id="message" role="status"></p><table><thead><tr><th>Bo‘lim</th><th>Ruxsat</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const names=['Boshqaruv paneli','1C buxgalteriya qoldig‘i','Main / UPR qoldig‘i','UPR kirimlari','1C / EHF kirimlari','Kirimlarni solishtirish','Qoldiqlarni solishtirish','TASNIF / Soliq','SHTRIX KOD','Ta’minotchilar','Do‘kon–korxona bog‘lash','Seriya raqamlari','Hisobotlar','Sozlamalar va audit','EDO — Didox fakturalari','Nomenklatura','Dastur','KM'];
const employee=document.getElementById('employee'),rows=document.getElementById('rows'),message=document.getElementById('message');let grants=[];
async function load(){const r=await fetch('/api/access');if(!r.ok)throw Error('Admin sifatida kiring');const d=await r.json();grants=d.grants;employee.replaceChildren();for(const u of d.users.filter(u=>u.role!=='admin'))employee.add(new Option(u.login,u.login));draw()}
function draw(){rows.replaceChildren();if(!employee.value){message.textContent='Xodim mavjud emas';return}names.forEach((name,section)=>{const tr=rows.insertRow();tr.insertCell().textContent=name;const select=document.createElement('select');for(const [label,value] of [['Ruxsat yo‘q',''],['Ko‘rish','read'],['Tahrirlash','write']])select.add(new Option(label,value));const login=employee.value;let old=grants.find(g=>g.login===login&&g.section===section)?.mode||'';select.value=old;tr.insertCell().append(select);select.onchange=async()=>{select.disabled=true;const mode=select.value;try{const r=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,section,mode:mode||null})});if(!r.ok)throw Error('Saqlanmadi');grants=grants.filter(g=>g.login!==login||g.section!==section);if(mode)grants.push({login,section,mode});old=mode;message.textContent='Saqlandi'}catch(e){select.value=old;message.textContent=e.message}finally{select.disabled=false}}})}employee.onchange=draw;load().catch(e=>message.textContent=e.message);
</script></html>
