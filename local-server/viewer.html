<!doctype html><html lang="uz"><meta charset="utf-8"><title>Solishtiruv 2.0 Local</title><style>body{font:16px Aptos,Arial;background:#eef6ef;color:#193c2a;margin:30px}input,button{padding:10px;margin:5px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}button{background:#176c43;color:white;border:0;border-radius:6px}</style><h1>Solishtiruv 2.0 Local</h1><form id="login"><input name="login" placeholder="Login" required><input name="password" type="password" placeholder="Parol" required><button>Kirish</button></form><p id="msg"></p><section id="main" hidden><h2>Nomenklatura solishtirish</h2><section id="admin" hidden><h3>Xodim qo‘shish</h3><form id="employee"><input name="login" required placeholder="Login"><input name="password" type="password" minlength="10" required placeholder="Parol"><button>Qo‘shish</button></form><label>Natijalar JSON fayli <input id="file" type="file" accept=".json"></label><button id="publish">Natijalarni yuklash</button></section><input id="search" placeholder="Qidirish"><button id="refresh">Yangilash</button><table><thead><tr><th>Didox nomi</th><th>UPR nomi</th><th>Asl shtrix</th><th>Biriktirilgan shtrix</th><th>Holati</th></tr></thead><tbody id="rows"></tbody></table></section><script>const $=id=>document.getElementById(id);let data=[];async function api(p,d){const r=await fetch('/api/'+p,d===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}function draw(){const q=$('search').value.toLowerCase();$('rows').replaceChildren();for(const x of data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,2000)){const tr=document.createElement('tr');for(const k of ['name','uprName','barcode','effectiveBarcode','status']){const td=document.createElement('td');td.textContent=x[k]||'';tr.append(td)}$('rows').append(tr)}}async function load(){data=await api('report');draw()}async function start(){const me=await api('me');$('login').hidden=true;$('main').hidden=false;$('admin').hidden=me.role!=='admin';await load()}function run(fn){return async e=>{e?.preventDefault();try{await fn(e);$('msg').textContent='Tayyor'}catch(err){$('msg').textContent=err.message}}}$('login').onsubmit=run(async e=>{await api('login',Object.fromEntries(new FormData(e.target)));e.target.reset();await start()});$('employee').onsubmit=run(async e=>{await api('users',Object.fromEntries(new FormData(e.target)));e.target.reset()});$('publish').onclick=run(async()=>{await api('report',JSON.parse(await $('file').files[0].text()));await load()});$('refresh').onclick=run(load);$('search').oninput=draw;start().catch(()=>{});</script></html>
