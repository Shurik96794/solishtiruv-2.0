function parseCSV(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}async function importUprExcel(e){const f=e.target.files?.[0];if(!f)return;let status=document.getElementById('uprStatus');try{if(typeof XLSX==='undefined')throw Error('Excel kutubxonasi yuklanmadi');let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),matrix=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}),groups=[['Do‘kon nomi','Do‘kon','Filial','store','Ташкилот'],['Tovar ID','tovar_id','Товар ИД'],['Variant kodi','variant_code','tovar_kodi','sku','Товар коди'],['Ta’minotchi nomi','Taminotchi','Ta’minotchi','supplier','Таъминотчи'],['Tovar nomi','Tovar Variant nomi','product','Товар номи'],['Soni','Miqdor','qty','Сони'],['Narxi','Kirim narxi','price','Нарх'],['Kirim sanasi','Sana','date','Амалиёт санаси']],norm=x=>String(x??'').trim().toLowerCase().replace(/[’‘ʻ']/g,'').replace(/\s+/g,' '),hi=matrix.findIndex(row=>groups.every(g=>row.some(c=>g.some(n=>norm(n)===norm(c)))));if(hi<0)throw Error('Excel sarlavhalari aniqlanmadi. Faylning yuqori qatorlaridagi ustun nomlarini tekshiring.');let idx=groups.map(g=>matrix[hi].findIndex(c=>g.some(n=>norm(n)===norm(c)))),supplierIdCol=matrix[hi].findIndex(c=>['Таъмиинотчи ИД','Таъминотчи ИД','Ta’minotchi ID','supplierId'].some(n=>norm(n)===norm(c))),valid=[],bad=0;for(let row of matrix.slice(hi+1)){if(row.every(v=>String(v??'').trim()===''))continue;let v=idx.map(i=>String(row[i]??'').trim()),qty=Number(v[5].replace(/\s/g,'').replace(',','.')),price=Number(v[6].replace(/\s/g,'').replace(',','.'));if(!v[0]||!v[1]||!v[3]||!v[4]||!v[5]||!v[6]||!Number.isFinite(qty)||!Number.isFinite(price)){bad++;continue}valid.push({store:v[0],tovarId:v[1],variantCode:v[2],supplier:v[3],supplierId:supplierIdCol>=0?String(row[supplierIdCol]??'').trim():'',product:v[4],qty,price,date:v[7]})}if(!valid.length)throw Error('Yaroqli qator yo‘q: '+bad);let old=records[3]||[];records[3]=old.concat(valid);try{await uprStore(records[3]);save()}catch(err){records[3]=old;throw Error('Excel saqlanmadi: '+err.message)}status.textContent=valid.length+' ta yuklandi, '+bad+' ta xato qator o‘tkazildi';drawRows();drawUprSuppliers()}catch(err){status.textContent='Xatolik: '+err.message}finally{e.target.value=''}}

let uprSupplierSelection=new Set();
function uprSupplierNorm(v){return String(v??'').trim().toLocaleLowerCase().replace(/\s+/g,' ')}
function uprSupplierCandidates(){
 const map=new Map(),known=new Set(suppliers().map(x=>uprSupplierNorm(x.name)));
 for(const x of records[3]||[]){
  const name=String(x.supplier??'').trim(),id=String(x.supplierId??'').trim();
  if(!name)continue;
  const key=id?'id:'+id:'name:'+uprSupplierNorm(name);
  if(!map.has(key))map.set(key,{key,id,name,count:0,exists:false});
  map.get(key).count++;
 }
 for(const x of map.values())x.exists=known.has(uprSupplierNorm(x.name))||!!(x.id&&suppliers().some(y=>String(y.mainId||'')===x.id));
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function addUprSuppliers(all,keys){

let uprAppliedFilters={from:'',to:'',store:'',supplier:''};
function uprDateISO(value){
 const t=String(value??'').trim();if(!t)return '';
 let m=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
 if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 m=t.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);
 if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 m=t.match(/^(\d{1,2})[- ]([A-Za-z]{3})[- ](\d{2,4})/);
 if(m){const months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],i=months.indexOf(m[2].toLowerCase());if(i>=0)return (m[3].length===2?'20'+m[3]:m[3])+'-'+String(i+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
 return '';
}

let barcodeRows=[],barcodeIndex=new Map(),barcodeFilter='all',barcodeQuery='',barcodeShowSku=false,barcodeShowAllNames=false;
function barcodeKey(v){return String(v??'').normalize('NFKC').toUpperCase().replace(/[\s\u200B-\u200D\uFEFF]/g,'').replace(/[‐‑‒–—−]/g,'-')}
function barcodeNameIndex(){const byPc=new Map(),byId=new Map();for(const x of records[3]||[]){const pc=barcodeKey(x.variantCode),id=String(x.tovarId??'').trim(),name=String(x.product??'').trim();if(!name)continue;if(pc){if(!byPc.has(pc))byPc.set(pc,new Set());byPc.get(pc).add(name)}if(id){if(!byId.has(id))byId.set(id,new Set());byId.get(id).add(name)}}const unique=values=>values&&values.size===1?[...values][0]:'';return {byPc,byId,unique}}
function rebuildBarcodeIndex(){barcodeIndex=new Map();for(const row of barcodeRows){const k=barcodeKey(row.pc);if(!k)continue;if(!barcodeIndex.has(k))barcodeIndex.set(k,new Set());if(row.barcode)barcodeIndex.get(k).add(String(row.barcode))}}

function reportRefresh(){

 if(Object.values(row).some(v=>!v)){alert('Barcha maydonlarni to‘ldiring');return}

async function importStoreCompanyExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 const status=document.getElementById('storeCompanyMessage');
 try{
 if(typeof XLSX==='undefined')throw Error('Excel kutubxonasi yuklanmadi');
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),norm=x=>String(x??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[\s_-]/g,'');
 const columns=['organizationid','organizationname','mchj','inn','type'];
 const incoming=[];let invalid=0,matched=false;
 for(const sheet of wb.SheetNames){
 const data=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:false});
 const header=data.findIndex(row=>columns.every(c=>row.some(v=>norm(v)===c)));if(header<0)continue;matched=true;
 const indexes=columns.map(c=>data[header].findIndex(v=>norm(v)===c));
 for(const line of data.slice(header+1)){
 if(line.every(v=>!String(v??'').trim()))continue;
 const [storeId,storeName,company,inn,type]=indexes.map(i=>String(line[i]??'').trim());
 if(!storeId||!storeName||!company||!inn||!type){invalid++;continue}
 incoming.push({storeId,storeName,company,inn,type});
 }
 }
 if(!matched)throw Error('OrganizationId, OrganizationName, MCHJ, INN, Type sarlavhalari topilmadi');
 if(!incoming.length)throw Error('Yaroqli bog‘lanish qatorlari topilmadi');
 const current=storeCompanyRows(),map=new Map(current.map(x=>[storeCompanyKey(x),x]));let added=0,updated=0;
 for(const row of incoming){const key=storeCompanyKey(row);if(map.has(key))updated++;else added++;map.set(key,row)}
 const types=storeCompanyActivities(),typeMap=new Map(types.map(t=>[t.toLocaleLowerCase(),t]));for(const row of incoming)if(!typeMap.has(row.type.toLocaleLowerCase()))typeMap.set(row.type.toLocaleLowerCase(),row.type);
 records.storeCompanies=[...map.values()];records.activityTypes=[...typeMap.values()];
 try{save()}catch(err){records.storeCompanies=current;records.activityTypes=types;throw Error('Brauzer xotirasida joy yetarli emas: '+err.message)}
 storeCompanyNotice=file.name+': '+added+' ta yangi bog‘lanish, '+updated+' ta mavjud bog‘lanish yangilandi, '+invalid+' ta noto‘liq qator o‘tkazildi.';
 drawStoreCompanyTable();
 document.getElementById('storeCompanyMessage').textContent=file.name+': '+added+' ta yangi bog‘lanish, '+updated+' ta mavjud bog‘lanish yangilandi, '+invalid+' ta noto‘liq qator o‘tkazildi.';
 }catch(err){status.textContent='Import xatosi: '+err.message}finally{e.target.value=''}
}

function addSupplierEntityRow(name='',inn='',note=''){const area=document.getElementById('supplierEntityInputs');if(!area)return;const row=document.createElement('div');row.className='toolbar supplier-entity-row';row.innerHTML='<input class="entity-name" placeholder="MCHJ to‘liq nomi" style="min-width:280px"><input class="entity-inn" placeholder="STIR (ixtiyoriy, 9 raqam)" inputmode="numeric" pattern="[0-9]{9}"><input class="entity-note" placeholder="Izoh"><button type="button" class="secondary">Olib tashlash</button>';row.querySelector('.entity-name').value=name;row.querySelector('.entity-inn').value=inn;row.querySelector('.entity-note').value=note;row.querySelector('button').onclick=()=>row.remove();area.appendChild(row)}

function bindSuppliers(){document.getElementById('newSupplier').onclick=openNewSupplier;document.getElementById('closeSupplierDialog').onclick=()=>document.getElementById('supplierDialog').close();document.getElementById('addSupplierEntity').onclick=()=>addSupplierEntityRow();document.getElementById('supplierForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;const norm=x=>String(x||'').trim().toLocaleLowerCase();if(suppliers().some(x=>norm(x.name)===norm(name)&&x.id!==editingSupplier)){alert('Bu MAIN ta’minotchisi allaqachon mavjud');return}const rows=[...document.querySelectorAll('.supplier-entity-row')].map(row=>({name:row.querySelector('.entity-name').value.trim(),inn:row.querySelector('.entity-inn').value.trim(),note:row.querySelector('.entity-note').value.trim()})).filter(x=>x.name);const seen=new Set();for(const x of rows){if(x.inn&&!/^\d{9}$/.test(x.inn)){alert('STIR kiritilsa 9 ta raqam bo‘lishi kerak');return}const k=x.inn?'inn:'+x.inn:'name:'+norm(x.name);if(seen.has(k)){alert('Bir xil MCHJ takror kiritilgan');return}seen.add(k)}let id=editingSupplier;if(id){let x=suppliers().find(x=>x.id===id);if(!x)return;Object.assign(x,{name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}else{id=crypto.randomUUID();(records.suppliers??=[]).push({id,name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}records.supplierEntities=supplierEntities().filter(x=>x.supplierId!==id);for(const x of rows)records.supplierEntities.push({id:crypto.randomUUID(),supplierId:id,...x});editingSupplier=null;save();document.getElementById('supplierDialog').close();render()};document.getElementById('cancelSupplier').onclick=()=>{editingSupplier=null;document.getElementById('supplierDialog').close()};addSupplierEntityRow();
document.getElementById('supplierSearch').oninput=drawSuppliers;document.getElementById('supplierExcel').onchange=e=>{const f=e.target.files?.[0];if(f){const n=document.getElementById('supplierFileName');n.textContent='Tanlangan fayl: '+f.name;n.classList.remove('hidden')}importSupplierExcel(e)};document.getElementById('supplierHelpToggle').onclick=()=>document.getElementById('supplierHelp').classList.toggle('hidden');document.getElementById('supplierMoreToggle').onclick=()=>document.getElementById('supplierMoreMenu').classList.toggle('hidden');document.getElementById('supplierTemplate').onclick=()=>downloadData('taminotchilar_namuna.csv','\uFEFFTaminotchi,MCHJ nomi\r\nАртел спец проект,\r\nTrade,Trade MCHJ\r\nTrade,Trade Savdo MCHJ','text/csv;charset=utf-8');document.getElementById('exportSupplierCsv').onclick=()=>{const rows=[['Taminotchi','MCHJ nomi','STIR']];for(const x of suppliers()){const entities=supplierEntities().filter(y=>y.supplierId===x.id);if(!entities.length)rows.push([x.name,'','']);else for(const y of entities)rows.push([x.name,y.name,y.inn||'']);}const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadData('taminotchilar.csv',csv,'text/csv;charset=utf-8')};document.getElementById('exportSuppliers').onclick=()=>downloadData('taminotchilar_zaxira.json',JSON.stringify({suppliers:suppliers(),supplierEntities:supplierEntities()},null,2),'application/json');document.getElementById('importSuppliers').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.suppliers)||!Array.isArray(d.supplierEntities))throw Error('Noto‘g‘ri fayl');if(!confirm('Joriy ta’minotchilar ma’lumotlari importdagi ma’lumotlar bilan almashtirilsinmi?'))return;records.suppliers=d.suppliers;records.supplierEntities=d.supplierEntities;save();render()}catch(err){alert('Import xatosi: '+err.message)}};drawSuppliers()}

async function importSupplierExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  let rows=[];
  if(/\.csv$/i.test(file.name)){
   let txt=(await file.text()).replace(/^\uFEFF/,'');let sep=(txt.split(/\r?\n/)[0].match(/;/g)||[]).length>(txt.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';
   rows=txt.split(/\r?\n/).filter(x=>x.trim()).map(line=>{if(sep===',')return parseCSV(line);return line.split(';').map(x=>x.trim().replace(/^"|"$/g,''))});
  }else{
   if(typeof XLSX==='undefined')throw Error('Excel o‘qish kutubxonasi yuklanmadi. Internetni tekshiring yoki CSV formatidan foydalaning.');
   let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  }
  const normalize=x=>String(x??'').trim().toLowerCase().replace(/[’‘ʻ`']/g,'').replace(/\s+/g,' ');
  let headerAt=rows.findIndex(r=>r.some(c=>['taminotchi','ta’minotchi',"ta'minotchi",'main taminotchi nomi'].map(normalize).includes(normalize(c)))&&r.some(c=>['mchj nomi','yuridik korxona nomi','mchj'].includes(normalize(c))));
  if(headerAt<0)throw Error('Taminotchi va MCHJ nomi ustunlari topilmadi. Excelning birinchi sarlavha qatorini tekshiring.');
  let head=rows[headerAt].map(normalize),si=head.findIndex(x=>['taminotchi','taminotchi','main taminotchi nomi'].includes(x)),mi=head.findIndex(x=>['mchj nomi','yuridik korxona nomi','mchj'].includes(x));
  let incoming=rows.slice(headerAt+1).filter(r=>String(r[si]??'').trim()).map(r=>({name:String(r[si]).trim(),entity:String(r[mi]??'').trim()}));
  if(!incoming.length)throw Error('Import uchun ta’minotchi topilmadi.');
  if(!confirm(incoming.length+' ta Excel qatori topildi. Mavjud ma’lumotlarni saqlagan holda qo‘shilsinmi?'))return;
  let newS=0,newE=0,duplicates=0;
  for(const row of incoming){
   let supplier=suppliers().find(x=>normalize(x.name)===normalize(row.name));
   if(!supplier){supplier={id:crypto.randomUUID(),name:row.name,phone:'',note:''};(records.suppliers??=[]).push(supplier);newS++}
   if(row.entity){
    if(supplierEntities().some(x=>x.supplierId===supplier.id&&normalize(x.name)===normalize(row.entity))){duplicates++;continue}
    (records.supplierEntities??=[]).push({id:crypto.randomUUID(),supplierId:supplier.id,name:row.entity,inn:'',note:'Excel import'});newE++;
   }
  }
  save();render();alert('Import yakunlandi. Yangi MAIN ta’minotchilari: '+newS+'; yangi MCHJ bog‘lanishlari: '+newE+'; takroriy MCHJ: '+duplicates+'.');
 }catch(err){alert('Excel import xatosi: '+err.message)}
}

function drawSuppliers(){let q=(document.getElementById('supplierSearch')?.value||'').toLowerCase();let a=suppliers().filter(x=>(x.name+' '+(x.phone||'')+' '+supplierEntities().filter(y=>y.supplierId===x.id).map(y=>y.name+' '+y.inn).join(' ')).toLowerCase().includes(q));document.getElementById('supplierRows').innerHTML=`<div style="overflow:auto"><table><thead><tr><th>MAIN ta’minotchi nomi</th><th>Yuridik korxona nomi (MCHJ)</th><th>STIR</th><th>Telefon / izoh</th><th style="width:110px">Amallar</th></tr></thead><tbody>${a.map(x=>`<tr><td><button type="button" class="supplier-name-link" onclick="editSupplier('${x.id}')">${esc(x.name)}</button></td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.name||'—')}</div>`).join('')||'<span class="muted">Biriktirilmagan</span>'}</td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.inn||'—')}</div>`).join('')||'—'}</td><td>${esc(x.phone||'')}<div class="muted">${esc(x.note||'')}</div></td><td><div class="supplier-actions"><button type="button" class="supplier-icon-button" title="Korxonalarni ko‘rish" aria-label="Ko‘rish" onclick="viewSupplier('${x.id}')">👁</button><button type="button" class="supplier-icon-button" title="Ta’minotchi va MCHJlarni tahrirlash" aria-label="Tahrirlash" onclick="editSupplier('${x.id}')">✎</button></div></td></tr>`).join('')}</tbody></table></div><p class="muted">Ko‘rsatilmoqda: ${a.length} ta ta’minotchi</p>`}
function viewSupplier(id){const x=suppliers().find(y=>y.id===id);if(!x)return;const entities=supplierEntities().filter(y=>y.supplierId===id);const dlg=document.getElementById('supplierViewDialog');const root=document.getElementById('supplierViewContent');root.innerHTML='<h3>'+esc(x.name)+'</h3><p><b>Telefon:</b> '+esc(x.phone||'—')+' &nbsp; <b>Izoh:</b> '+esc(x.note||'—')+'</p><h4>Biriktirilgan korxonalar ('+entities.length+')</h4>'+(entities.length?'<table><thead><tr><th>MCHJ nomi</th><th>STIR</th><th>Izoh</th></tr></thead><tbody>'+entities.map(y=>'<tr><td>'+esc(y.name)+'</td><td>'+esc(y.inn||'—')+'</td><td>'+esc(y.note||'—')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">Hozircha MCHJ biriktirilmagan.</p>');dlg.showModal()}
function editSupplier(id){let x=suppliers().find(x=>x.id===id);if(!x)return;editingSupplier=id;let f=document.getElementById('supplierForm');f.elements.name.value=x.name;f.elements.phone.value=x.phone||'';f.elements.note.value=x.note||'';document.getElementById('supplierEntityInputs').innerHTML='';const entities=supplierEntities().filter(y=>y.supplierId===id);if(entities.length)entities.forEach(y=>addSupplierEntityRow(y.name,y.inn||'',y.note||''));else addSupplierEntityRow();document.getElementById('supplierDialogTitle').textContent='Ta’minotchi: '+x.name;document.getElementById('supplierDialog').showModal()}
function editEntity(id){let y=supplierEntities().find(x=>x.id===id);if(!y)return;let name=prompt('MCHJ nomi:',y.name);if(name===null)return;name=name.trim();if(!name){alert('MCHJ nomi bo‘sh bo‘lmasin');return}let inn=prompt('STIR (ixtiyoriy, 9 raqam):',y.inn||'');if(inn===null)return;inn=inn.trim();if(inn&&!/^\d{9}$/.test(inn)){alert('STIR 9 ta raqam bo‘lishi kerak');return}if(supplierEntities().some(x=>x.id!==id&&x.supplierId===y.supplierId&&((inn&&x.inn===inn)||(!inn&&x.name.trim().toLowerCase()===name.toLowerCase())))){alert('Bu MCHJ allaqachon biriktirilgan');return}y.name=name;y.inn=inn;save();drawSuppliers()}
function removeEntity(id){if(!confirm('Yuridik shaxs bog‘lanishini o‘chirasizmi?'))return;records.supplierEntities=supplierEntities().filter(x=>x.id!==id);save();drawSuppliers()}
function removeSupplier(id){if(supplierEntities().some(x=>x.supplierId===id)){alert('Avval biriktirilgan yuridik shaxslarni ajrating');return}if(!confirm('Ta’minotchini o‘chirasizmi?'))return;records.suppliers=suppliers().filter(x=>x.id!==id);save();render()}
function downloadData(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
