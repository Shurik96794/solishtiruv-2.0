script>

let active=0;let editingSupplier=null;const key='solishtiruv2_demo_data';let records=JSON.parse(localStorage.getItem(key)||'{}');const save=()=>{const copy={...records};delete copy[3];localStorage.setItem(key,JSON.stringify(copy))};
function uprDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('solishtiruv2_upr',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

async function uprLoad(){try{const db=await uprDb(),rows=await new Promise((resolve,reject)=>{const tx=db.transaction('data','readonly'),req=tx.objectStore('data').get('receipts');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(Array.isArray(rows)){records[3]=rows}else if(Array.isArray(records[3])&&records[3].length){await uprStore(records[3]);save()}if(active===3){drawRows();drawUprSuppliers()}}catch(err){console.error('UPR saqlash xatosi',err)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function suppliers(){return records.suppliers||[]}function supplierEntities(){return records.supplierEntities||[]}function render(){document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="${i===active?'active':''}" onclick="active=${i};render()">${s[0]} ${s[1]}</button>`).join('');document.getElementById('title').textContent=sections[active][1];document.getElementById('desc').textContent=sections[active][2];let html='';if(active===0){html=`<div class="cards">${[['Yuklangan bo‘limlar',Object.keys(records).filter(k=>records[k]?.length).length],['UPR kirim qatorlari',(records[3]||[]).length],['1C kirim qatorlari',(records[4]||[]).length],['Qoldiq qatorlari',(records[1]||[]).length+(records[2]||[]).length]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h3>Ishni boshlash</h3><p>Chap menyudan bo‘limni tanlang. UPR kirimlari bo‘limida ma’lumotni qo‘lda kiritish va CSV fayldan yuklash ishlaydi.</p><div class="notice">Bu dastlabki lokal prototip. Ma’lumotlar brauzer xotirasida saqlanadi; 1C va UPR serverlariga hali ulanmagan.</div></div>`}else if(active===8){html=supplierPage()}else if(active===3){html=`<div class="panel"><div class="toolbar"><label class="supplier-upload-button" for="uprExcel">▤ UPR Excel yuklash</label><input type="file" id="uprExcel" accept=".xlsx,.xls,.csv" class="supplier-visually-hidden"><button class="secondary" onclick="exportCsv()">Excel eksport (CSV)</button><input id="uprSearch" placeholder="Tovar nomi, ID yoki variant kodi..." style="flex:1;min-width:260px"><button id="uprTemplate" class="secondary">Namuna CSV</button></div><div class="upr-filter-bar">

<details class="upr-filter" id="uprSupplierFilterPanel"><summary>▤ Ta’minotchi <span id="uprSupplierFilterLabel">Barcha ta’minotchilar</span></summary><div class="upr-filter-body"><b>Ta’minotchini tanlang</b><input id="uprSupplierFilter" list="uprSupplierOptions" placeholder="Nomi yoki MAIN ID..."><datalist id="uprSupplierOptions"></datalist><div class="upr-filter-actions"><button type="button" class="secondary" id="uprSupplierFilterClear">Tozalash</button><button type="button" class="supplier-add-button" id="uprSupplierFilterApply">Qo‘llash</button></div></div></details>
<button type="button" class="secondary" id="uprFilterReset">↺ Filtrlarni tozalash</button></div><div class="toolbar" style="align-items:center;margin:6px 0"><details class="upr-help"><summary title="UPR Kirim haqida ma’lumot" aria-label="UPR Kirim haqida ma’lumot">i</summary><div class="upr-help-body"><b>UPR Kirim — ma’lumotnoma</b><p>Excel ma’lumotlari 8 ustunga ajratiladi: Do‘kon nomi, Tovar ID, Variant kodi, Ta’minotchi nomi, Tovar nomi, Soni, Narxi va Kirim sanasi.</p><p>Qidiruv barcha yuklangan qatorlar bo‘yicha ishlaydi. Jadvalda birinchi 300 ta mos qator ko‘rsatiladi.</p><p>Ma’lumotlar shu brauzerda saqlanadi. Excel yuklash mavjud kirimlarni avtomatik o‘chirmaydi.</p></div></details><span id="uprStatus" class="muted" aria-live="polite"></span></div><details id="uprSupplierPanel" style="margin:12px 0;border:1px solid #d9e2ef;border-radius:10px;padding:10px 14px"><summary style="cursor:pointer;font-weight:600;list-style-position:inside">▸ Ta’minotchilarni spravochnikga qo‘shish <span id="uprSupplierBadge" class="muted" style="font-weight:400"></span></summary><div style="padding:12px 0 2px"><div class="toolbar" style="gap:8px;flex-wrap:wrap"><input id="uprSupplierSearch" placeholder="Ta’minotchi ID yoki nomi..." style="flex:1;min-width:190px"><button type="button" class="secondary" id="uprSupplierSelectAll">Barchasini tanlash</button><button type="button" class="secondary" id="uprSupplierClear">Tozalash</button><button type="button" class="supplier-add-button" id="uprSupplierAddSelected">Tanlanganlarni qo‘shish</button><button type="button" class="secondary" id="uprSupplierAddAll">Barcha yangilarni qo‘shish</button></div><div id="uprSupplierSummary" class="muted" style="margin:8px 0"></div><div id="uprSupplierList" style="max-height:280px;overflow:auto"></div></div></details><div id="rows"></div></div>`}else{html=`<div class="panel"><h3>${sections[active][1]}</h3><p>Bo‘lim dastur tuzilmasiga qo‘shilgan. Ma’lumotlar modeli va ishlash qoidalarini kelishib, navbatma-navbat ishga tushiramiz.</p><div class="notice">Hozircha ushbu bo‘limda hisob-kitob va integratsiya funksiyasi yo‘q.</div></div>`}document.getElementById('content').innerHTML=html;if(active===8){bindSuppliers()}if(active===3){document.getElementById('uprExcel').onchange=importUprExcel;document.getElementById('uprSearch').oninput=drawRows;bindUprFilters();document.getElementById('uprSupplierSearch').oninput=drawUprSuppliers;document.getElementById('uprSupplierSelectAll').onclick=()=>{uprSupplierSelection=new Set(uprSupplierCandidates().filter(x=>!x.exists).map(x=>x.key));drawUprSuppliers()};document.getElementById('uprSupplierClear').onclick=()=>{uprSupplierSelection.clear();drawUprSuppliers()};document.getElementById('uprSupplierAddSelected').onclick=()=>addUprSuppliers(false);document.getElementById('uprSupplierAddAll').onclick=()=>addUprSuppliers(true);document.getElementById('uprTemplate').onclick=()=>downloadData('UPR_kirim_namuna.csv','Do‘kon nomi,Tovar ID,Variant kodi,Ta’minotchi nomi,Tovar nomi,Soni,Narxi,Kirim sanasi\\r\\nQo‘qon,000123,VAR001,Artel,Muzlatkich,2,1500000,2026-11-18','text/csv;charset=utf-8');drawRows();drawUprSuppliers()}}function parseCSV(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}async function importUprExcel(e){const f=e.target.files?.[0];if(!f)return;let status=document.getElementById('uprStatus');try{if(typeof XLSX==='undefined')throw Error('Excel kutubxonasi yuklanmadi');let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),matrix=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}),groups=[['Do‘kon nomi','Do‘kon','Filial','store','Ташкилот'],['Tovar ID','tovar_id','Товар ИД'],['Variant kodi','variant_code','tovar_kodi','sku','Товар коди'],['Ta’minotchi nomi','Taminotchi','Ta’minotchi','supplier','Таъминотчи'],['Tovar nomi','T let uprSupplierSelection=new Set();
function uprSupplierNorm(v){return String(v??'').trim().toLocaleLowerCase().replace(/\s+/g,' ')}
function uprSupplierCandidates(){
 const map=new Map(),known=new Set(suppliers().map(x=>uprSupplierNorm(x.name)));
 for(const x of records[3]||[]){
  const name=String(x.supplier??'').trim(),id=String(x.supplierId??'').trim();
  if(!name)continue;
  const key=id?'id:'+id:'name:'+uprSupplierNorm(name);
  if(!map.has(key))map.set(key,{key,id,name,count:0,exists:false});
  map.get(key).count++;
 }
 for(const x of map.values())x.exists=known.has(uprSupplierNorm(x.name))||!!(x.id&&suppliers().some(y=>String(y.mainId||'')===x.id));
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function drawUprSuppliers(){

 const list=uprSupplierCandidates(),q=uprSupplierNorm(document.getElementById('uprSupplierSearch')?.value||''),filtered=list.filter(x=>uprSupplierNorm(x.name).includes(q)||x.id.includes(q));
 const available=list.filter(x=>!x.exists);
 document.getElementById('uprSupplierBadge').textContent='('+available.length+' ta yangi)';document.getElementById('uprSupplierSummary').textContent='Excelda: '+list.length+' ta noyob ta’minotchi · Spravochnikda mavjud: '+(list.length-available.length)+' ta · Yangi: '+available.length+' ta · Tanlangan: '+[...uprSupplierSelection].filter(k=>available.some(x=>x.key===k)).length+' ta';
 target.innerHTML=filtered.length?'<table><thead><tr><th>Tanlash</th><th>MAIN ID</th><th>Ta’minotchi nomi</th><th>Qatorlar</th><th>Holat</th><th>Amal</th></tr></thead><tbody>'+filtered.map(x=>'<tr><td><input type="checkbox" data-upr-key="'+esc(x.key)+'" '+(x.exists?'disabled ':'')+(uprSupplierSelection.has(x.key)?'checked':'')+'></td><td>'+esc(x.id||'—')+'</td><td>'+esc(x.name)+'</td><td>'+x.count+'</td><td>'+(x.exists?'Mavjud':'Yangi')+'</td><td><button type="button" class="secondary" data-upr-add="'+esc(x.key)+'" '+(x.exists?'disabled':'')+'>+ Qo‘shish</button></td></tr>').join('')+'</tbody></table>':'<p class="muted">Ta’minotchi topilmadi.</p>';
 target.querySelectorAll('[data-upr-key]').forEach(el=>el.onchange=()=>{if(el.checked)uprSupplierSelection.add(el.dataset.uprKey);else uprSupplierSelection.delete(el.dataset.uprKey);drawUprSuppliers()});
 target.querySelectorAll('[data-upr-add]').forEach(el=>el.onclick=()=>addUprSuppliers(false,[el.dataset.uprAdd]));
}
function addUprSuppliers(all,keys){
 const candidates=uprSupplierCandidates().filter(x=>!x.exists),chosen=candidates.filter(x=>all||keys?keys?keys.includes(x.key):true:uprSupplierSelection.has(x.key));
 if(!chosen.length){alert('Qo‘shish uchun yangi ta’minotchi tanlanmagan.');return}
 if(!confirm(chosen.length+' ta ta’minotchini spravochnikga qo‘shasizmi? MCHJ va STIR avtomatik yaratilmaydi.'))return;
 const before=suppliers().slice();
 const current=new Set(before.map(x=>uprSupplierNorm(x.name)));
 let added=0;
 for(const x of chosen){const k=uprSupplierNorm(x.name);if(current.has(k))continue;(records.suppliers??=[]).push({id:crypto.randomUUID(),name:x.name,mainId:x.id||'',phone:'',note:''});current.add(k);added++}
 try{save()}catch(e){records.suppliers=before;alert('Saqlashda xatolik: '+e.message);return}
 uprSupplierSelection.clear();drawUprSuppliers();alert(added+' ta ta’minotchi spravochnikga qo‘shildi.');
}

let uprAppliedFilters={from:'',to:'',store:'',supplier:''};
function uprDateISO(value){
 const t=String(value??'').trim();if(!t)return '';
 let m=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
 if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 m=t.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);
 if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 m=t.match(/^(\d{1,2})[- ]([A-Za-z]{3})[- ](\d{2,4})/);
 if(m){const months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],i=months.indexOf(m[2].toLowerCase());if(i>=0)return (m[3].length===2?'20'+m[3]:m[3])+'-'+String(i+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
 return '';
}
function bindUprFilters(){

  if(kind==='date'){const from=byId('uprDateFrom').value,to=byId('uprDateTo').value;if(from&&to&&from>to){alert('Boshlanish sanasi tugash sanasidan keyin bo‘lishi mumkin emas');return}uprAppliedFilters.from=from;uprAppliedFilters.to=to;byId('uprDatePanel').open=false}
  if(kind==='store'){uprAppliedFilters.store=byId('uprStoreFilter').value.trim();byId('uprStorePanel').open=false}
  if(kind==='supplier'){uprAppliedFilters.supplier=byId('uprSupplierFilter').value.trim();byId('uprSupplierFilterPanel').open=false}
  drawRows();
 };
 ['uprDatePanel','uprStorePanel','uprSupplierFilterPanel'].forEach(id=>byId(id).addEventListener('toggle',()=>{if(byId(id).open)['uprDatePanel','uprStorePanel','uprSupplierFilterPanel'].filter(other=>other!==id).forEach(other=>byId(other).open=false)}));
 byId('uprDateApply').onclick=()=>apply('date');byId('uprStoreApply').onclick=()=>apply('store');byId('uprSupplierFilterApply').onclick=()=>apply('supplier');
 byId('uprDateClear').onclick=()=>{byId('uprDateFrom').value='';byId('uprDateTo').value='';apply('date')};

 byId('uprStoreFilter').onkeydown=e=>{if(e.key==='Enter')apply('store')};
 byId('uprSupplierFilter').onkeydown=e=>{if(e.key==='Enter')apply('supplier')};
}
function uprRefreshFilterOptions(){
 const all=records[3]||[];
 for(const [field,id] of [['store','uprStoreOptions'],['supplier','uprSupplierOptions']]){
  const target=document.getElementById(id);if(!target)return;
  const names=[...new Set(all.map(x=>String(x[field]??'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  target.innerHTML=names.map(n=>'<option value="'+esc(n)+'"></option>').join('');
 }
}
function drawRows(){
 const all=records[3]||[],q=(document.getElementById('uprSearch')?.value||'').trim().toLocaleLowerCase(),f=uprAppliedFilters;
 const store=f.store.toLocaleLowerCase(),supplier=f.supplier.toLocaleLowerCase();
 const arr=all.filter(x=>{
  if(q&&![x.tovarId,x.variantCode,x.product].some(v=>String(v??'').toLocaleLowerCase().includes(q)))return false;
  if(store&&!String(x.store??'').toLocaleLowerCase().includes(store))return false;
  if(supplier&&!String(x.supplier??'').toLocaleLowerCase().includes(supplier)&&!String(x.supplierId??'').toLocaleLowerCase().includes(supplier))return false;
  if(f.from||f.to){const d=uprDateISO(x.date);if(!d||(f.from&&d<f.from)||(f.to&&d>f.to))return false}
  return true;
 });
 const sum=arr.reduce((total,x)=>total+(Number(x.qty)||0)*(Number(x.price)||0),0);
 document.getElementById('rows').innerHTML='<p>Jami: <b>'+all.length+'</b> · Filtr bo‘yicha: <b>'+arr.length+'</b> · Kirim qiymati: <b>'+sum.toLocaleString('uz-UZ')+'</b></p><div style="overflow:auto"><table><thead><tr>'+['Do‘kon nomi','Tovar ID','Variant kodi','Ta’minotchi nomi','Tovar nomi','Soni','Narxi','Kirim sanasi'].map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+arr.slice(0,300).map(x=>'<tr>'+[x.store,x.tovarId,x.variantCode,x.supplier,x.product,x.qty,x.price,x.date].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 const labels=[['uprDateLabel',f.from||f.to?[f.from||'…',f.to||'…'].join(' — '):'Barcha davr'],['uprStoreLabel',f.store||'Barcha do‘konlar'],['uprSupplierFilterLabel',f.supplier||'Barcha ta’minotchilar']];
 for(const [id,label] of labels){const el=document.getElementById(id);if(el){el.textContent=label;el.title=label}}
 uprRefreshFilterOptions();
}
async function clearRows(){if(confirm('UPR kirimlarining barcha lokal qatorlari o‘chirilsinmi?')){await uprStore([]);records[3]=[];save();drawRows();drawUprSuppliers()}}function exportCsv(){let cols=['Do‘kon nomi','Tovar ID','Variant kodi','Ta’minotchi nomi','Tovar nomi','Soni','Narxi','Kirim sanasi'],rows=[cols,...(records[3]||[]).map(x=>[x.store,x.tovarId,x.variantCode,x.supplier,x.product,x.qty,x.price,x.date])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadData('UPR_kirimlari.csv','\uFEFF'+csv,'text/csv;charset=utf-8')}
function supplierPage(){let a=suppliers(),b=supplierEntities();return `<div class="cards"><div class="card">Ta’minotchilar<strong>${a.length}</strong></div><div class="card">Yuridik shaxslar<strong>${b.length}</strong></div><div class="card">STIRsiz korxonalar<strong>${b.filter(x=>!x.inn).length}</strong></div></div><div class="panel supplier-main-panel"><div class="supplier-top-toolbar"><button type="button" class="supplier-add-button" id="newSupplier">⊕ Ta’minotchi qo‘shish</button><label for="supplierExcel" class="supplier-upload-button">▤ Excel yuklash</label><input id="supplierExcel" type="file" accept=".xlsx,.xls,.csv" class="supplier-visually-hidden"><button class="secondary" id="exportSupplierCsv">Excel eksport</button><input id="supplierSearch" placeholder="Nom, MCHJ yoki STIR bo‘yicha qidirish"><button id="supplierHelpToggle" class="supplier-help-button" title="Excel talablari">ⓘ</button><div class="supplier-more"><button id="supplierMoreToggle" class="secondary">Zaxira ▾</button><div id="supplierMoreMenu" class="supplier-more-menu hidden"><button id="exportSuppliers" class="secondary">JSON zaxira nusxasi</button><label class="secondary">JSON import <input type="file" id="importSuppliers" accept=".json,application/json"></label><button id="supplierTemplate" class="secondary">Namuna CSV</button></div></div></div><div id="supplierFileName" class="supplier-file-name hidden"></div><div id="supplierHelp" class="supplier-help hidden">Excel ustunlari: <b>Taminotchi</b> (yoki Ta’minotchi) va <b>MCHJ nomi</b>. Mavjud yozuvlar o‘chirilmaydi.</div><div id="supplierRows"></div></div><dialog id="supplierDialog" class="supplier-dialog"><button type="button" class="supplier-dialog-close" id="closeSupplierDialog" aria-label="Yopish">×</button><div class="supplier-dialog-inner"><h3 id="supplierDialogTitle">Ta’minotchi va uning korxonalari</h3><form id="supplierForm"><div class="toolbar"><input name="name" placeholder="MAIN ta’minotchi nomi" required style="min-width:280px"><input name="phone" placeholder="Telefon"><input name="note" placeholder="Izoh"></div><h4>Biriktirilgan MCHJlar</h4><div id="supplierEntityInputs"></div><div class="toolbar"><button type="button" class="secondary" id="addSupplierEntity">+ Yana MCHJ qo‘shish</button><button class="primary" type="submit">Ta’minotchi va MCHJlarni saqlash</button><button class="secondary" type="button" id="cancelSupplier">Bekor qilish</button></div></form><div class="notice">Bitta MAIN ta’minotchisiga bir nechta MCHJ biriktirish mumkin. STIR ixtiyoriy. MCHJ nomi kiritilmagan bo‘sh qatorlar saqlanmaydi.</div></div></dialog><dialog id="supplierViewDialog" class="supplier-dialog"><button type="button" class="supplier-dialog-close" onclick="document.getElementById('supplierViewDialog').close()" aria-label="Yopish">×</button><div id="supplierViewContent"></div><div class="toolbar"><button type="button" class="secondary" onclick="document.getElementById('supplierViewDialog').close()">Yopish</button></div></dialog>`}

function addSupplierEntityRow(name='',inn='',note=''){const area=document.getElementById('supplierEntityInputs');if(!area)return;const row=document.createElement('div');row.className='toolbar supplier-entity-row';row.innerHTML='<input class="entity-name" placeholder="MCHJ to‘liq nomi" style="min-width:280px"><input class="entity-inn" placeholder="STIR (ixtiyoriy, 9 raqam)" inputmode="numeric" pattern="[0-9]{9}"><input class="entity-note" placeholder="Izoh"><button type="button" class="secondary">Olib tashlash</button>';row.querySelector('.entity-name').value=name;row.querySelector('.entity-inn').value=inn;row.querySelector('.entity-note').value=note;row.querySelector('button').onclick=()=>row.remove();area.appendChild(row)}
function openNewSupplier(){editingSupplier=null;document.getElementById('supplierForm').reset();document.getElementById('supplierEntityInputs').innerHTML='';addSupplierEntityRow();document.getElementById('supplierDialogTitle').textContent='Yangi ta’minotchi va korxonalari';document.getElementById('supplierDialog').showModal()}
function bindSuppliers(){document.getElementById('newSupplier').onclick=openNewSupplier;document.getElementById('closeSupplierDialog').onclick=()=>document.getElementById('supplierDialog').close();document.getElementById('addSupplierEntity').onclick=()=>addSupplierEntityRow();document.getElementById('supplierForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;const norm=x=>String(x||'').trim().toLocaleLowerCase();if(suppliers().some(x=>norm(x.name)===norm(name)&&x.id!==editingSupplier)){alert('Bu MAIN ta’minotchisi allaqachon mavjud');return}const rows=[...document.querySelectorAll('.supplier-entity-row')].map(row=>({name:row.querySelector('.entity-name').value.trim(),inn:row.querySelector('.entity-inn').value.trim(),note:row.querySelector('.entity-note').value.trim()})).filter(x=>x.name);const seen=new Set();for(const x of rows){if(x.inn&&!/^\d{9}$/.test(x.inn)){alert('STIR kiritilsa 9 ta raqam bo‘lishi kerak');return}const k=x.inn?'inn:'+x.inn:'name:'+norm(x.name);if(seen.has(k)){alert('Bir xil MCHJ takror kiritilgan');return}seen.add(k)}let id=editingSupplier;if(id){let x=suppliers().find(x=>x.id===id);if(!x)return;Object.assign(x,{name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}else{id=crypto.randomUUID();(records.suppliers??=[]).push({id,name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}records.supplierEntities=supplierEntities().filter(x=>x.supplierId!==id);for(const x of rows)records.supplierEntities.push({id:crypto.randomUUID(),supplierId:id,...x});editingSupplier=null;save();document.getElementById('supplierDialog').close();render()};document.getElementById('cancelSupplier').onclick=()=>{editingSupplier=null;document.getElementById('supplierDialog').close()};addSupplierEntityRow();
document.getElementById('supplierSearch').oninput=drawSuppliers;document.getElementById('supplierExcel').onchange=e=>{const f=e.target.files?.[0];if(f){const n=document.getElementById('supplierFileName');n.textContent='Tanlangan fayl: '+f.name;n.classList.remove('hidden')}importSupplierExcel(e)};document.getElementById('supplierHelpToggle').onclick=()=>document.getElementById('supplierHelp').classList.toggle('hidden');document.getElementById('supplierMoreToggle').onclick=()=>document.getElementById('supplierMoreMenu').classList.toggle('hidden');document.getElementById('supplierTemplate').onclick=()=>downloadData('taminotchilar_namuna.csv','\uFEFFTaminotchi,MCHJ nomi\r\nАртел спец проект,\r\nTrade,Trade MCHJ\r\nTrade,Trade Savdo MCHJ','text/csv;charset=utf-8');document.getElementById('exportSupplierCsv').onclick=()=>{const rows=[['Taminotchi','MCHJ nomi','STIR']];for(const x of suppliers()){const entities=supplierEntities().filter(y=>y.supplierId===x.id);if(!entities.length)rows.push([x.name,'','']);else for(const y of entities)rows.push([x.name,y.name,y.inn||'']);}const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadData('taminotchilar.csv',csv,'text/csv;charset=utf-8')};document.getElementById('exportSuppliers').onclick=()=>downloadData('taminotchilar_zaxira.json',JSON.stringify({suppliers:suppliers(),supplierEntities:supplierEntities()},null,2),'application/json');document.getElementById('importSuppliers').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.suppliers)||!Array.isArray(d.supplierEntities))throw Error('Noto‘g‘ri fayl');if(!confirm('Joriy ta’minotchilar ma’lumotlari importdagi ma’lumotlar bilan almashtirilsinmi?'))return;records.suppliers=d.suppliers;records.supplierEntities=d.supplierEntities;save();render()}catch(err){alert('Import xatosi: '+err.message)}};drawSuppliers()}

async function importSupplierExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  let rows=[];
  if(/\.csv$/i.test(file.name)){
   let txt=(await file.text()).replace(/^\uFEFF/,'');let sep=(txt.split(/\r?\n/)[0].match(/;/g)||[]).length>(txt.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';
   rows=txt.split(/\r?\n/).filter(x=>x.trim()).map(line=>{if(sep===',')return parseCSV(line);return line.split(';').map(x=>x.trim().replace(/^"|"$/g,''))});
  }else{
   if(typeof XLSX==='undefined')throw Error('Excel o‘qish kutubxonasi yuklanmadi. Internetni tekshiring yoki CSV formatidan foydalaning.');
   let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  }
  const normalize=x=>String(x??'').trim().toLowerCase().replace(/[’‘ʻ`']/g,'').replace(/\s+/g,' ');
  let headerAt=rows.findIndex(r=>r.some(c=>['taminotchi','ta’minotchi',"ta'minotchi",'main taminotchi nomi'].map(normalize).includes(normalize(c)))&&r.some(c=>['mchj nomi','yuridik korxona nomi','mchj'].includes(normalize(c))));
  if(headerAt<0)throw Error('Taminotchi va MCHJ nomi ustunlari topilmadi. Excelning birinchi sarlavha qatorini tekshiring.');
  let head=rows[headerAt].map(normalize),si=head.findIndex(x=>['taminotchi','taminotchi','main taminotchi nomi'].includes(x)),mi=head.findIndex(x=>['mchj nomi','yuridik korxona nomi','mchj'].includes(x));
  let incoming=rows.slice(headerAt+1).filter(r=>String(r[si]??'').trim()).map(r=>({name:String(r[si]).trim(),entity:String(r[mi]??'').trim()}));
  if(!incoming.length)throw Error('Import uchun ta’minotchi topilmadi.');
  if(!confirm(incoming.length+' ta Excel qatori topildi. Mavjud ma’lumotlarni saqlagan holda qo‘shilsinmi?'))return;
  let newS=0,newE=0,duplicates=0;
  for(const row of incoming){
   let supplier=suppliers().find(x=>normalize(x.name)===normalize(row.name));
   if(!supplier){supplier={id:crypto.randomUUID(),name:row.name,phone:'',note:''};(records.suppliers??=[]).push(supplier);newS++}
   if(row.entity){
    if(supplierEntities().some(x=>x.supplierId===supplier.id&&normalize(x.name)===normalize(row.entity))){duplicates++;continue}
    (records.supplierEntities??=[]).push({id:crypto.randomUUID(),supplierId:supplier.id,name:row.entity,inn:'',note:'Excel import'});newE++;
   }
  }
  save();render();alert('Import yakunlandi. Yangi MAIN ta’minotchilari: '+newS+'; yangi MCHJ bog‘lanishlari: '+newE+'; takroriy MCHJ: '+duplicates+'.');
 }catch(err){alert('Excel import xatosi: '+err.message)}
}

function drawSuppliers(){let q=(document.getElementById('supplierSearch')?.value||'').toLowerCase();let a=suppliers().filter(x=>(x.name+' '+(x.phone||'')+' '+supplierEntities().filter(y=>y.supplierId===x.id).map(y=>y.name+' '+y.inn).join(' ')).toLowerCase().includes(q));document.getElementById('supplierRows').innerHTML=`<div style="overflow:auto"><table><thead><tr><th>MAIN ta’minotchi nomi</th><th>Yuridik korxona nomi (MCHJ)</th><th>STIR</th><th>Telefon / izoh</th><th style="width:110px">Amallar</th></tr></thead><tbody>${a.map(x=>`<tr><td><button type="button" class="supplier-name-link" onclick="editSupplier('${x.id}')">${esc(x.name)}</button></td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.name||'—')}</div>`).join('')||'<span class="muted">Biriktirilmagan</span>'}</td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.inn||'—')}</div>`).join('')||'—'}</td><td>${esc(x.phone||'')}<div class="muted">${esc(x.note||'')}</div></td><td><div class="supplier-actions"><button type="button" class="supplier-icon-button" title="Korxonalarni ko‘rish" aria-label="Ko‘rish" onclick="viewSupplier('${x.id}')">👁</button><button type="button" class="supplier-icon-button" title="Ta’minotchi va MCHJlarni tahrirlash" aria-label="Tahrirlash" onclick="editSupplier('${x.id}')">✎</button></div></td></tr>`).join('')}</tbody></table></div><p class="muted">Ko‘rsatilmoqda: ${a.length} ta ta’minotchi</p>`}
function viewSupplier(id){const x=suppliers().find(y=>y.id===id);if(!x)return;const entities=supplierEntities().filter(y=>y.supplierId===id);const dlg=document.getElementById('supplierViewDialog');const root=document.getElementById('supplierViewContent');root.innerHTML='<h3>'+esc(x.name)+'</h3><p><b>Telefon:</b> '+esc(x.phone||'—')+' &nbsp; <b>Izoh:</b> '+esc(x.note||'—')+'</p><h4>Biriktirilgan korxonalar ('+entities.length+')</h4>'+(entities.length?'<table><thead><tr><th>MCHJ nomi</th><th>STIR</th><th>Izoh</th></tr></thead><tbody>'+entities.map(y=>'<tr><td>'+esc(y.name)+'</td><td>'+esc(y.inn||'—')+'</td><td>'+esc(y.note||'—')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">Hozircha MCHJ biriktirilmagan.</p>');dlg.showModal()}
function editSupplier(id){let x=suppliers().find(x=>x.id===id);if(!x)return;editingSupplier=id;let f=document.getElementById('supplierForm');f.elements.name.value=x.name;f.elements.phone.value=x.phone||'';f.elements.note.value=x.note||'';document.getElementById('supplierEntityInputs').innerHTML='';const entities=supplierEntities().filter(y=>y.supplierId===id);if(entities.length)entities.forEach(y=>addSupplierEntityRow(y.name,y.inn||'',y.note||''));else addSupplierEntityRow();document.getElementById('supplierDialogTitle').textContent='Ta’minotchi: '+x.name;document.getElementById('supplierDialog').showModal()}
function editEntity(id){let y=supplierEntities().find(x=>x.id===id);if(!y)return;let name=prompt('MCHJ nomi:',y.name);if(name===null)return;name=name.trim();if(!name){alert('MCHJ nomi bo‘sh bo‘lmasin');return}let inn=prompt('STIR (ixtiyoriy, 9 raqam):',y.inn||'');if(inn===null)return;inn=inn.trim();if(inn&&!/^\d{9}$/.test(inn)){alert('STIR 9 ta raqam bo‘lishi kerak');return}if(supplierEntities().some(x=>x.id!==id&&x.supplierId===y.supplierId&&((inn&&x.inn===inn)||(!inn&&x.name.trim().toLowerCase()===name.toLowerCase())))){alert('Bu MCHJ allaqachon biriktirilgan');return}y.name=name;y.inn=inn;save();drawSuppliers()}
function removeEntity(id){if(!confirm('Yuridik shaxs bog‘lanishini o‘chirasizmi?'))return;records.supplierEntities=supplierEntities().filter(x=>x.id!==id);save();drawSuppliers()}
function removeSupplier(id){if(supplierEntities().some(x=>x.supplierId===id)){alert('Avval biriktirilgan yuridik shaxslarni ajrating');return}if(!confirm('Ta’minotchini o‘chirasizmi?'))return;records.suppliers=suppliers().filter(x=>x.id!==id);save();render()}
function downloadData(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

render();
uprLoad();
