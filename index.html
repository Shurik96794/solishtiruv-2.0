<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SOLISHTIRUV 2.0</title><style>:root{font-family:Aptos,"Segoe UI",Arial,sans-serif;font-size:12pt;color:#17263b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.layout{display:flex;min-height:100vh}aside{width:270px;background:#13243c;color:#d9e3f0;padding:25px 15px;flex-shrink:0}aside h2{color:white;margin:0 10px 5px}aside small{display:block;margin:0 10px 26px;color:#9bb0ca}nav button{width:100%;border:0;background:transparent;color:inherit;padding:13px 12px;text-align:left;border-radius:9px;margin-bottom:4px;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#294568;color:white}main{padding:30px;flex:1;min-width:0}h1{margin:0 0 8px;font-size:28px}.muted{color:#67778e}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:22px 0}.card,.panel{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:20px}.card strong{display:block;font-size:25px;margin-top:9px}.panel{margin-top:18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e8edf4;padding:11px}th{background:#f7f9fc}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}input,select{padding:10px;border:1px solid #ccd7e5;border-radius:8px;max-width:100%}button.primary{background:#1762d3;color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer}button.secondary{background:#e8eef8;border:0;padding:11px 16px;border-radius:8px;cursor:pointer}.notice{background:#fff9e8;padding:13px;border-radius:9px;color:#745519;margin-top:15px}.hidden{display:none}@media(max-width:850px){.layout{display:block}aside{width:100%}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:16px}}body,button,input,select,textarea,table,th,td,label,p,div,span{font-family:Aptos,"Segoe UI",Arial,sans-serif}button,input,select,textarea,table{font-size:12pt}nav button{font-size:12pt}table{font-size:12pt}.supplier-import-panel{max-width:650px;margin-left:0;margin-right:auto;padding:14px}.supplier-import-panel h3{margin:0 0 10px}.supplier-import-panel .toolbar{margin:8px 0;align-items:center}.supplier-import-panel input[type=file]{max-width:260px}.supplier-import-panel .notice{font-size:12pt;margin-top:8px;padding:9px}</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><div class="layout"><aside><h2>SOLISHTIRUV 2.0</h2><small>Yagona nazorat platformasi · v0.2</small><button class="secondary" onclick="location.reload()" style="margin:0 10px 14px">↻ Yangilash</button><nav id="nav"></nav></aside><main><h1 id="title"></h1><p class="muted" id="desc"></p><div id="content"></div></main></div><script>
const sections=[['📊','Boshqaruv paneli','Barcha ma’lumotlar va nazorat holati'],['📘','1C buxgalteriya qoldig‘i','Korxona kesimida buxgalteriya qoldiqlari'],['🏬','Main / UPR qoldig‘i','Do‘konlar kesimida real qoldiq'],['📥','UPR kirimlari','Tovar, miqdor, narx, ta’minotchi va qabul qiluvchi do‘kon'],['🧾','1C / EHF kirimlari','Buxgalteriya kirim hujjatlari'],['🔍','Kirimlarni solishtirish','UPR va 1C hujjatlarini taqqoslash'],['⚖️','Qoldiqlarni solishtirish','1C va Main qoldig‘ini solishtirish'],['🔗','Nomenklatura moslashtirish','Shtrix-kod va tovar nomi bo‘yicha bog‘lash'],['🚚','Ta’minotchilar','Ta’minotchi va uning yuridik shaxslari'],['🏢','Do‘kon–korxona bog‘lash','Do‘kon va STIR bog‘lanishlari'],['🔢','Seriya raqamlari','Seriyali tovarlarning real joylashuvi'],['📈','Hisobotlar','Natijalarni ko‘rish va eksport qilish'],['⚙️','Sozlamalar va audit','Import tarixi va nazorat jurnali']];
let active=0;let editingSupplier=null;const key='solishtiruv2_demo_data';let records=JSON.parse(localStorage.getItem(key)||'{}');const save=()=>localStorage.setItem(key,JSON.stringify(records));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function suppliers(){return records.suppliers||[]}function supplierEntities(){return records.supplierEntities||[]}function render(){document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="${i===active?'active':''}" onclick="active=${i};render()">${s[0]} ${s[1]}</button>`).join('');document.getElementById('title').textContent=sections[active][1];document.getElementById('desc').textContent=sections[active][2];let html='';if(active===0){html=`<div class="cards">${[['Yuklangan bo‘limlar',Object.keys(records).filter(k=>records[k]?.length).length],['UPR kirim qatorlari',(records[3]||[]).length],['1C kirim qatorlari',(records[4]||[]).length],['Qoldiq qatorlari',(records[1]||[]).length+(records[2]||[]).length]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h3>Ishni boshlash</h3><p>Chap menyudan bo‘limni tanlang. UPR kirimlari bo‘limida ma’lumotni qo‘lda kiritish va CSV fayldan yuklash ishlaydi.</p><div class="notice">Bu dastlabki lokal prototip. Ma’lumotlar brauzer xotirasida saqlanadi; 1C va UPR serverlariga hali ulanmagan.</div></div>`}else if(active===8){html=supplierPage()}else if(active===3){html=`<div class="panel"><h3>UPR kirimlarini kiritish</h3><form id="add" class="toolbar"><input name="date" type="date" required><input name="doc" placeholder="Hujjat raqami" required><input name="supplier" placeholder="Kim tomonidan berilgan" required><input name="store" placeholder="Qabul qilgan do‘kon" required><input name="product" placeholder="Tovar nomi" required><input name="barcode" placeholder="Shtrix-kod"><input name="qty" type="number" step="any" placeholder="Miqdor" required><input name="price" type="number" step="any" placeholder="Narx" required><button class="primary">Qo‘shish</button></form><div class="toolbar"><label>CSV yuklash: <input type="file" id="csv" accept=".csv,text/csv"></label><button class="secondary" onclick="exportCsv()">CSV eksport</button><button class="secondary" onclick="clearRows()">Bo‘limni tozalash</button></div><div id="rows"></div><div class="notice">CSV ustunlari: date, doc, supplier, store, product, barcode, qty, price. Excel fayllari va katta hajmli ma’lumotlar uchun keyingi bosqichda server bazasi ulanadi.</div></div>`}else{html=`<div class="panel"><h3>${sections[active][1]}</h3><p>Bo‘lim dastur tuzilmasiga qo‘shilgan. Ma’lumotlar modeli va ishlash qoidalarini kelishib, navbatma-navbat ishga tushiramiz.</p><div class="notice">Hozircha ushbu bo‘limda hisob-kitob va integratsiya funksiyasi yo‘q.</div></div>`}document.getElementById('content').innerHTML=html;if(active===8){bindSuppliers()}if(active===3){document.getElementById('add').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.qty=Number(x.qty);x.price=Number(x.price);(records[3]??=[]).push(x);save();e.target.reset();drawRows()};document.getElementById('csv').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();let lines=t.replace(/^\uFEFF/,'').trim().split(/\r?\n/);let headers=parseCSV(lines.shift());let added=0;for(let line of lines){if(!line.trim())continue;let vals=parseCSV(line),r={};headers.forEach((h,i)=>r[h.trim()]=vals[i]||'');if(r.product){r.qty=Number(r.qty)||0;r.price=Number(r.price)||0;(records[3]??=[]).push(r);added++}}save();alert(added+' ta qator yuklandi');drawRows()};drawRows()}}function parseCSV(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}function drawRows(){let arr=records[3]||[];document.getElementById('rows').innerHTML=`<p>Jami: <b>${arr.length}</b> qator. Umumiy qiymat: <b>${arr.reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.price)||0),0).toLocaleString('uz-UZ')}</b></p><div style="overflow:auto"><table><thead><tr>${['Sana','Hujjat','Ta’minotchi','Do‘kon','Tovar','Shtrix','Miqdor','Narx','Summa'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${arr.slice(-100).reverse().map(x=>`<tr>${[x.date,x.doc,x.supplier,x.store,x.product,x.barcode,x.qty,x.price,(Number(x.qty)||0)*(Number(x.price)||0)].map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function clearRows(){if(confirm('UPR kirimlarining barcha lokal qatorlari o‘chirilsinmi?')){records[3]=[];save();drawRows()}}function exportCsv(){let a=records[3]||[],keys=['date','doc','supplier','store','product','barcode','qty','price'];let csv=[keys.join(','),...a.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='UPR_kirimlari.csv';link.click();URL.revokeObjectURL(url)}
function supplierPage(){let a=suppliers(),b=supplierEntities();return `<div class="cards"><div class="card">Ta’minotchilar<strong>${a.length}</strong></div><div class="card">Yuridik shaxslar<strong>${b.length}</strong></div><div class="card">STIRsiz korxonalar<strong>${b.filter(x=>!x.inn).length}</strong></div></div><div class="panel"><h3>MAIN ta’minotchisi va uning yuridik korxonalari</h3><form id="supplierForm"><div class="toolbar"><input name="name" placeholder="MAIN ta’minotchi nomi" required style="min-width:280px"><input name="phone" placeholder="Telefon"><input name="note" placeholder="Izoh"></div><h4>Biriktirilgan MCHJlar</h4><div id="supplierEntityInputs"></div><div class="toolbar"><button type="button" class="secondary" id="addSupplierEntity">+ Yana MCHJ qo‘shish</button><button class="primary" type="submit">Ta’minotchi va MCHJlarni saqlash</button><button class="secondary" type="button" id="cancelSupplier">Bekor qilish</button></div></form><div class="notice">Bitta MAIN ta’minotchisiga bir nechta MCHJ biriktirish mumkin. STIR ixtiyoriy. MCHJ nomi kiritilmagan bo‘sh qatorlar saqlanmaydi.</div></div><div class="panel supplier-import-panel"><h3>Excel orqali ta’minotchilarni yuklash</h3><div class="toolbar"><label>Excel (.xlsx, .xls) yoki CSV: <input type="file" id="supplierExcel" accept=".xlsx,.xls,.csv"></label><button class="secondary" id="supplierTemplate">Namuna CSV</button></div><div class="notice">Excel ustunlari: <b>Taminotchi</b> (yoki Ta’minotchi) va <b>MCHJ nomi</b>. Birinchi qator sarlavha bo‘lishi kerak. MCHJ bo‘sh bo‘lsa ham MAIN ta’minotchisi qo‘shiladi. Mavjud yozuvlar o‘chirilmaydi. Excel o‘qish uchun internet ulanishi kerak.</div></div><div class="panel"><div class="toolbar"><input id="supplierSearch" placeholder="Nom, MCHJ yoki STIR bo‘yicha qidirish" style="min-width:290px"><button class="secondary" id="exportSupplierCsv">Excel uchun CSV</button><button class="secondary" id="exportSuppliers">JSON zaxira nusxasi</button><label class="secondary" style="cursor:pointer">JSON import <input type="file" id="importSuppliers" accept=".json,application/json" style="width:180px"></label></div><div id="supplierRows"></div></div>`}
function addSupplierEntityRow(name='',inn='',note=''){const area=document.getElementById('supplierEntityInputs');if(!area)return;const row=document.createElement('div');row.className='toolbar supplier-entity-row';row.innerHTML='<input class="entity-name" placeholder="MCHJ to‘liq nomi" style="min-width:280px"><input class="entity-inn" placeholder="STIR (ixtiyoriy, 9 raqam)" inputmode="numeric" pattern="[0-9]{9}"><input class="entity-note" placeholder="Izoh"><button type="button" class="secondary">Olib tashlash</button>';row.querySelector('.entity-name').value=name;row.querySelector('.entity-inn').value=inn;row.querySelector('.entity-note').value=note;row.querySelector('button').onclick=()=>row.remove();area.appendChild(row)}
function bindSuppliers(){document.getElementById('addSupplierEntity').onclick=()=>addSupplierEntityRow();document.getElementById('supplierForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;const norm=x=>String(x||'').trim().toLocaleLowerCase();if(suppliers().some(x=>norm(x.name)===norm(name)&&x.id!==editingSupplier)){alert('Bu MAIN ta’minotchisi allaqachon mavjud');return}const rows=[...document.querySelectorAll('.supplier-entity-row')].map(row=>({name:row.querySelector('.entity-name').value.trim(),inn:row.querySelector('.entity-inn').value.trim(),note:row.querySelector('.entity-note').value.trim()})).filter(x=>x.name);const seen=new Set();for(const x of rows){if(x.inn&&!/^\d{9}$/.test(x.inn)){alert('STIR kiritilsa 9 ta raqam bo‘lishi kerak');return}const k=x.inn?'inn:'+x.inn:'name:'+norm(x.name);if(seen.has(k)){alert('Bir xil MCHJ takror kiritilgan');return}seen.add(k)}let id=editingSupplier;if(id){let x=suppliers().find(x=>x.id===id);if(!x)return;Object.assign(x,{name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}else{id=crypto.randomUUID();(records.suppliers??=[]).push({id,name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}records.supplierEntities=supplierEntities().filter(x=>x.supplierId!==id);for(const x of rows)records.supplierEntities.push({id:crypto.randomUUID(),supplierId:id,...x});editingSupplier=null;save();render()};document.getElementById('cancelSupplier').onclick=()=>{editingSupplier=null;render()};addSupplierEntityRow();
document.getElementById('supplierSearch').oninput=drawSuppliers;document.getElementById('supplierExcel').onchange=importSupplierExcel;document.getElementById('supplierTemplate').onclick=()=>downloadData('taminotchilar_namuna.csv','\uFEFFTaminotchi,MCHJ nomi\r\nАртел спец проект,\r\nTrade,Trade MCHJ\r\nTrade,Trade Savdo MCHJ','text/csv;charset=utf-8');document.getElementById('exportSupplierCsv').onclick=()=>{const rows=[['Taminotchi','MCHJ nomi','STIR']];for(const x of suppliers()){const entities=supplierEntities().filter(y=>y.supplierId===x.id);if(!entities.length)rows.push([x.name,'','']);else for(const y of entities)rows.push([x.name,y.name,y.inn||'']);}const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadData('taminotchilar.csv',csv,'text/csv;charset=utf-8')};document.getElementById('exportSuppliers').onclick=()=>downloadData('taminotchilar_zaxira.json',JSON.stringify({suppliers:suppliers(),supplierEntities:supplierEntities()},null,2),'application/json');document.getElementById('importSuppliers').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.suppliers)||!Array.isArray(d.supplierEntities))throw Error('Noto‘g‘ri fayl');if(!confirm('Joriy ta’minotchilar ma’lumotlari importdagi ma’lumotlar bilan almashtirilsinmi?'))return;records.suppliers=d.suppliers;records.supplierEntities=d.supplierEntities;save();render()}catch(err){alert('Import xatosi: '+err.message)}};drawSuppliers()}

async function importSupplierExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  let rows=[];
  if(/\.csv$/i.test(file.name)){
   let txt=(await file.text()).replace(/^\uFEFF/,'');let sep=(txt.split(/\r?\n/)[0].match(/;/g)||[]).length>(txt.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';
   rows=txt.split(/\r?\n/).filter(x=>x.trim()).map(line=>{if(sep===',')return parseCSV(line);return line.split(';').map(x=>x.trim().replace(/^"|"$/g,''))});
  }else{
   if(typeof XLSX==='undefined')throw Error('Excel o‘qish kutubxonasi yuklanmadi. Internetni tekshiring yoki CSV formatidan foydalaning.');
   let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  }
  const normalize=x=>String(x??'').trim().toLowerCase().replace(/[’‘ʻ`']/g,'').replace(/\s+/g,' ');
  let headerAt=rows.findIndex(r=>r.some(c=>['taminotchi','ta’minotchi',"ta'minotchi",'main taminotchi nomi'].map(normalize).includes(normalize(c)))&&r.some(c=>['mchj nomi','yuridik korxona nomi','mchj'].includes(normalize(c))));
  if(headerAt<0)throw Error('Taminotchi va MCHJ nomi ustunlari topilmadi. Excelning birinchi sarlavha qatorini tekshiring.');
  let head=rows[headerAt].map(normalize),si=head.findIndex(x=>['taminotchi','taminotchi','main taminotchi nomi'].includes(x)),mi=head.findIndex(x=>['mchj nomi','yuridik korxona nomi','mchj'].includes(x));
  let incoming=rows.slice(headerAt+1).filter(r=>String(r[si]??'').trim()).map(r=>({name:String(r[si]).trim(),entity:String(r[mi]??'').trim()}));
  if(!incoming.length)throw Error('Import uchun ta’minotchi topilmadi.');
  if(!confirm(incoming.length+' ta Excel qatori topildi. Mavjud ma’lumotlarni saqlagan holda qo‘shilsinmi?'))return;
  let newS=0,newE=0,duplicates=0;
  for(const row of incoming){
   let supplier=suppliers().find(x=>normalize(x.name)===normalize(row.name));
   if(!supplier){supplier={id:crypto.randomUUID(),name:row.name,phone:'',note:''};(records.suppliers??=[]).push(supplier);newS++}
   if(row.entity){
    if(supplierEntities().some(x=>x.supplierId===supplier.id&&normalize(x.name)===normalize(row.entity))){duplicates++;continue}
    (records.supplierEntities??=[]).push({id:crypto.randomUUID(),supplierId:supplier.id,name:row.entity,inn:'',note:'Excel import'});newE++;
   }
  }
  save();render();alert('Import yakunlandi. Yangi MAIN ta’minotchilari: '+newS+'; yangi MCHJ bog‘lanishlari: '+newE+'; takroriy MCHJ: '+duplicates+'.');
 }catch(err){alert('Excel import xatosi: '+err.message)}
}

function drawSuppliers(){let q=(document.getElementById('supplierSearch')?.value||'').toLowerCase();let a=suppliers().filter(x=>(x.name+' '+x.phone+' '+supplierEntities().filter(y=>y.supplierId===x.id).map(y=>y.name+' '+y.inn).join(' ')).toLowerCase().includes(q));document.getElementById('supplierRows').innerHTML=`<div style="overflow:auto"><table><thead><tr><th>MAIN ta’minotchi nomi</th><th>Yuridik korxona nomi (MCHJ)</th><th>STIR</th><th>Telefon / izoh</th><th>Amallar</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.name)}</div>`).join('')||'<span class="muted">Biriktirilmagan</span>'}</td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0"><b>${esc(y.inn||'—')}</b> <button class="secondary" style="padding:3px 7px" title="MCHJ nomi va STIRini tahrirlash" onclick="editEntity('${y.id}')">✎</button> <button class="secondary" style="padding:3px 7px" title="Bog‘lanishni olib tashlash" onclick="removeEntity('${y.id}')">×</button></div>`).join('')||'—'}</td><td>${esc(x.phone)}<div class="muted">${esc(x.note)}</div></td><td><button class="secondary" onclick="editSupplier('${x.id}')">Tahrirlash</button> <button class="secondary" onclick="removeSupplier('${x.id}')">O‘chirish</button></td></tr>`).join('')}</tbody></table></div><p class="muted">Ko‘rsatilmoqda: ${a.length} ta ta’minotchi</p>`}
function editSupplier(id){let x=suppliers().find(x=>x.id===id);if(!x)return;editingSupplier=id;let f=document.getElementById('supplierForm');f.elements.name.value=x.name;f.elements.phone.value=x.phone||'';f.elements.note.value=x.note||'';document.getElementById('supplierEntityInputs').innerHTML='';const entities=supplierEntities().filter(y=>y.supplierId===id);if(entities.length)entities.forEach(y=>addSupplierEntityRow(y.name,y.inn||'',y.note||''));else addSupplierEntityRow();f.scrollIntoView({behavior:'smooth'})}
function editEntity(id){let y=supplierEntities().find(x=>x.id===id);if(!y)return;let name=prompt('MCHJ nomi:',y.name);if(name===null)return;name=name.trim();if(!name){alert('MCHJ nomi bo‘sh bo‘lmasin');return}let inn=prompt('STIR (ixtiyoriy, 9 raqam):',y.inn||'');if(inn===null)return;inn=inn.trim();if(inn&&!/^\d{9}$/.test(inn)){alert('STIR 9 ta raqam bo‘lishi kerak');return}if(supplierEntities().some(x=>x.id!==id&&x.supplierId===y.supplierId&&((inn&&x.inn===inn)||(!inn&&x.name.trim().toLowerCase()===name.toLowerCase())))){alert('Bu MCHJ allaqachon biriktirilgan');return}y.name=name;y.inn=inn;save();drawSuppliers()}
function removeEntity(id){if(!confirm('Yuridik shaxs bog‘lanishini o‘chirasizmi?'))return;records.supplierEntities=supplierEntities().filter(x=>x.id!==id);save();drawSuppliers()}
function removeSupplier(id){if(supplierEntities().some(x=>x.supplierId===id)){alert('Avval biriktirilgan yuridik shaxslarni ajrating');return}if(!confirm('Ta’minotchini o‘chirasizmi?'))return;records.suppliers=suppliers().filter(x=>x.id!==id);save();render()}
function downloadData(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

render();</script></body></html>
