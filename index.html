/* Visual theme aligned with the supplied Main product-variants screenshot.
   Presentation-only overrides: no data, matching, or event logic changed. */
:root{color:#303c42;background:#fff}
body{background:#fff;color:#303c42}
.layout{background:#fff}
aside{width:232px;background:#405965;color:#f3f8f9;padding:12px 0 22px;border-right:1px solid #314a56}
aside h2{font-size:16px;letter-spacing:.35px;margin:9px 14px 5px;color:#fff}
aside small{margin:0 14px 16px;color:#c6d8de;font-size:11px;line-height:1.5}
aside>button.secondary{background:#506b77;color:#fff;border:1px solid #67808a;border-radius:3px}
nav{padding:0}
nav button{display:block;width:100%;margin:0;padding:12px 15px;border-radius:0;border:0;background:transparent;color:#f5f9fa;font-size:13px;font-weight:600;line-height:1.35;transition:background .15s}
nav button:hover{background:#4f6c77;color:#fff}
nav button.active{background:#31ce72;color:#fff}
nav button.active:hover{background:#27bf65}
main{padding:17px 16px 32px;background:#fff}
h1{font-size:20px;font-weight:600;margin:0 0 8px;color:#313b40}
h2,h3{color:#34444a}
.muted{color:#71818a}
.card,.panel{background:#fff;border:1px solid #d9e0e3;border-radius:3px;padding:15px;box-shadow:none}
.panel{margin-top:13px}
.cards{gap:10px;margin:14px 0}
.card strong{color:#344d55}
table{font-size:13px;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid #dbe3e5;vertical-align:middle}
th{background:#c6e4cc;color:#3d5546;font-weight:600}
tbody tr:hover{background:#f3faf5}
input,select,textarea{background:#fff;color:#34434a;border:1px solid #cbd5d9;border-radius:3px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid #8bd7ad;outline-offset:0;border-color:#34c978}
button.primary,.supplier-add-button{background:#39ba58;color:#fff;border:1px solid #31ad4e;border-radius:3px}
button.primary:hover,.supplier-add-button:hover{background:#2ea84c}
button.secondary{background:#f7f9fa;color:#45616b;border:1px solid #cbd6da;border-radius:3px}
button.secondary:hover{background:#eaf4ed}
.toolbar{gap:9px;margin:12px 0}
.notice{border-radius:3px;border:1px solid #e7dfb8}
.ehf-table-wrap,.sc-table{border-color:#d9e0e3}
.ehf-table th,.sc-table th{background:#c6e4cc;color:#3d5546}
.sc-stat,.barcode-stats>div,.report-item{border-radius:3px;box-shadow:none}
@media(max-width:850px){aside{width:100%;padding:10px 0}aside h2,aside small{margin-left:14px}nav{display:flex;overflow-x:auto}nav button{width:auto;min-width:max-content;padding:11px 14px}main{padding:14px}}

/* Accessible compact yellow help tips and program guide; presentation only */
.nav-help-row{display:flex;align-items:center;position:relative;min-width:0}
.nav-help-row>button{flex:1;min-width:0;padding-right:34px}
.nav-help-row>.help-tip{position:absolute;right:11px;top:50%;transform:translateY(-50%);z-index:3}
.help-tip{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:19px;height:19px;border-radius:50%;background:#ffd65c;color:#654b00;border:1px solid #e4b737;font-size:12px;font-weight:800;cursor:help;vertical-align:middle;margin-left:5px}
.help-tip-text{display:none;position:absolute;z-index:80;left:calc(100% + 9px);top:-9px;width:min(320px,75vw);padding:11px 13px;border:1px solid #e5c86b;border-radius:6px;background:#fff9dc;color:#3b3a2c;box-shadow:0 6px 22px #0002;font-size:12px;line-height:1.5;font-weight:400;white-space:normal;text-align:left;pointer-events:none}
.help-tip:hover .help-tip-text,.help-tip:focus .help-tip-text,.help-tip:focus-within .help-tip-text{display:block}
.nav-help-row>.help-tip .help-tip-text{left:calc(100% + 10px)}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px;margin:14px 0 22px}
.guide-item{background:#f8fbf9;border:1px solid #d7e7db;padding:14px;border-radius:5px}
.guide-item strong{color:#314b3a}
.guide-item p{color:#64747a;line-height:1.55;font-size:13px;min-height:37px}
.guide-item button{padding:7px 11px}
@media(max-width:850px){.nav-help-row{flex:none}.nav-help-row>button{padding-right:33px}.nav-help-row>.help-tip .help-tip-text{left:auto;right:0;top:26px}}

/* Section-level help: hide large explanatory yellow banners until requested */
.section-note{display:inline-block;position:relative;vertical-align:middle;margin:5px 0 9px}
.section-note>summary{list-style:none;display:flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;border:1px solid #d7a922;background:#ffd65c;color:#5f4900;font-size:14px;font-weight:800;cursor:pointer;user-select:none}
.section-note>summary::-webkit-details-marker{display:none}
.section-note[open]>summary{background:#f3c647}
.section-note-body{position:absolute;left:0;top:30px;width:min(540px,calc(100vw - 310px));max-height:320px;overflow:auto;z-index:100;background:#fff9dc;border:1px solid #e4c96e;border-radius:5px;box-shadow:0 9px 28px #1a2b3340}
.section-note-body .notice{margin:0;background:transparent;border:0;padding:13px 15px;color:#634b1b;line-height:1.55}
@media(max-width:850px){.section-note-body{width:min(500px,calc(100vw - 40px))}}

/* EDO redesign: scoped UI, existing integration/event IDs untouched */
.dx-workspace{border-radius:9px;padding:20px;background:#fff;border:1px solid #dce8e0}
.dx-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e4ece7;padding-bottom:14px;margin-bottom:15px}
.dx-heading h3{font-size:20px;margin:0 0 5px;color:#25483b}.dx-heading p{margin:0;font-size:13px}
.dx-readonly{border-radius:30px;background:#e7f8eb;color:#1b8546;padding:7px 13px;font-size:12px;font-weight:700}
.dx-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.dx-kpi{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:1px solid #dce8e1;background:#f6fbf8;padding:13px;border-radius:9px}
.dx-kpi>span{grid-row:span 2;font-size:24px}.dx-kpi small{font-size:12px;color:#557065}.dx-kpi strong{font-size:24px;color:#213c30}
.dx-connect{border:1px solid #dbe8e1;border-radius:8px;margin:15px 0;background:#fff}
.dx-connect>summary{cursor:pointer;padding:13px 16px;background:#f1f8f3;font-weight:700;color:#2e5a40;list-style:none}
.dx-connect>summary::-webkit-details-marker{display:none}
.dx-connect-hint{float:right;font-size:12px;color:#7a9384;font-weight:400}
.dx-connect-body{padding:13px 15px}.dx-connect-body .toolbar{margin:0}
.dx-section-label{font-weight:750;color:#315b43;font-size:14px;margin:19px 0 10px}
.dx-filter-row{padding:12px;background:#f8fbf9;border:1px solid #e0ebe4;border-radius:7px;gap:9px}
.dx-workspace .toolbar{align-items:center}.dx-workspace input,.dx-workspace select{border-radius:5px;min-height:40px}
.dx-workspace button.primary{background:#2eb85a;border-radius:5px;min-height:40px}.dx-workspace button.secondary{border-radius:5px;min-height:40px}
.dx-action-row{margin:12px 0 14px}.dx-list-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:17px 0 10px;color:#315b43}
.dx-list-title span{font-size:12px;color:#71877b}
.dx-workspace #dxTable table th{background:#c9e8d0;color:#315b43}.dx-workspace #dxTable table tbody tr:hover{background:#f0faf3}
@media(max-width:1100px){.dx-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.dx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dx-workspace{padding:12px}.dx-heading{align-items:flex-start}}

/* EDO/Didox compact top block: keep heading, KPIs and connection controls tightly grouped */
.dx-workspace{padding:14px 20px 16px!important}
.dx-workspace .dx-heading{padding-bottom:9px;margin-bottom:9px}
.dx-workspace .dx-heading h3{margin-bottom:2px}
.dx-workspace .dx-kpis{margin:8px 0;gap:8px}
.dx-workspace .dx-kpi{padding:8px 11px;min-height:62px}
.dx-workspace .dx-kpi>span{font-size:20px}
.dx-workspace .dx-kpi strong{font-size:21px}
.dx-workspace .dx-connect{margin:9px 0 0}
.dx-workspace .dx-connect>summary{padding:9px 13px}
.dx-workspace .dx-connect-body{padding:8px 12px}
.dx-workspace .dx-connect-body .toolbar{margin:0}
@media(max-width:720px){.dx-workspace{padding:12px!important}}

/* Collapsible Didox top block: closed by default, filters and registry stay visible */
.dx-top-fold{border:1px solid #dce8e1;border-radius:7px;background:#fff;margin:0 0 12px}
.dx-top-fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;padding:10px 13px;background:#f7fbf8;color:#234a39;font-weight:700;border-radius:7px}

.dx-top-fold[open] .dx-fold-arrow{transform:rotate(180deg)}
.dx-top-fold[open]>summary{border-bottom:1px solid #e4ece7;border-radius:7px 7px 0 0}

</style></head><body><div class="layout"><aside><h2>SOLISHTIRUV 2.0</h2><small>Yagona nazorat platformasi · v0.2</small><button class="secondary" onclick="location.reload()" style="margin:0 10px 14px">↻ Yangilash</button><nav id="nav"></nav></aside><main><h1 id="title"></h1><p class="muted" id="desc"></p><div id="content"></div></main></div><script>
const sections=[['📊','Boshqaruv paneli','Barcha ma’lumotlar va nazorat holati'],['📘','1C buxgalteriya qoldig‘i','Korxona kesimida buxgalteriya qoldiqlari'],['🏬','Main / UPR qoldig‘i','Do‘konlar kesimida real qoldiq'],['📥','UPR kirimlari','Tovar, miqdor, narx, ta’minotchi va qabul qiluvchi do‘kon'],['🧾','1C / EHF kirimlari','Buxgalteriya kirim hujjatlari'],['🔍','Kirimlarni solishtirish','UPR va 1C hujjatlarini taqqoslash'],['⚖️','Qoldiqlarni solishtirish','1C va Main qoldig‘ini solishtirish'],['🏛️','TASNIF / Soliq','MXIK va Soliq shtrix-kod ma’lumotnomasi'],['▥','SHTRIX KOD','PC kod va shtrix-kodlar ma’lumotnomasi'],['🚚','Ta’minotchilar','Ta’minotchi va uning yuridik shaxslari'],['🏢','Do‘kon–korxona bog‘lash','Do‘kon va STIR bog‘lanishlari'],['🔢','Seriya raqamlari','Seriyali tovarlarning real joylashuvi'],['📈','Hisobotlar','Natijalarni ko‘rish va eksport qilish'],['⚙️','Sozlamalar va audit','Import tarixi va nazorat jurnali'],['📄','EDO — Didox fakturalari','Kiruvchi elektron hisobvaraq-fakturalar, statuslar va eksport'],['🔗','Nomenklatura','Didox shtrix-kodsiz mahsulotlari va UPR moslashtirish'],['📗','Dastur','Bo‘limlar izohi, foydalanish tartibi va dastur qo‘llanmasi'],['📦','KM','KM bo‘limi']];

// Markaziy izohlar: mavjud hisoblash va moslashtirish funksiyalariga tegmaydi.
function helpBadge(message){
 return '<span class="help-tip" tabindex="0" role="note" aria-label="Bo‘lim haqida ma’lumot">?<span class="help-tip-text">'+esc(message)+'</span></span>';
}
// Faqat statik tushuntirish bloklarini ixcham sariq yordam belgisiga aylantiradi.
// Xatoliklar, Didox statusi va foydalanuvchiga muhim jonli xabarlar o‘z holicha qoladi.
function compactSectionNotices(){
 const root=document.getElementById('content');if(!root)return;
 root.querySelectorAll('.notice:not(#dxMessage):not(.help-notice-processed)').forEach(el=>{
  if(el.closest('dialog')||el.closest('[id$="Message"]')||el.textContent.trim().startsWith('Bo‘limni ochishda xatolik'))return;
  const details=document.createElement('details');details.className='section-note';
  const summary=document.createElement('summary');summary.textContent='?';summary.setAttribute('aria-label','Izohni ochish');summary.title='Izohni ochish';
  const content=document.createElement('div');content.className='section-note-body';
  el.classList.add('help-notice-processed');el.parentNode.insertBefore(details,el);
  details.appendChild(summary);content.appendChild(el);details.appendChild(content);
 });
}
function programGuidePage(){
 const steps=[
 ['Didox → Soliq → UPR','Didoxdagi 13 raqamli kod saqlanadi. Kod yetishmasa MXIK orqali Soliqdan qidiriladi. U yerda ham topilmasa nomenklatura moslashtirishda tekshiriladi.'],
 ['Shtrix-kod nazorati','13 raqamli kodlar avtomatik ishlatiladi. Qisqa Didox kodi asl holida saqlanadi; yaroqli kod biriktirilmaguncha tekshiruvda qoladi.'],
 ['Faktura manbasi','Didox nomenklaturasida ta’minotchi, STIR, faktura raqami va sanasi ko‘rsatiladi.'],
 ['Moslashtirish ro‘yxati','Yaroqli shtrix-kod biriktirilgan mahsulot ishchi ro‘yxatdan chiqadi, lekin Didox hujjati o‘chirilmaydi.'],
 ['Ma’lumotlar saqlanishi','Import qilingan ayrim ma’lumotlar shu brauzerning lokal xotirasi va IndexedDB bazasida saqlanadi. Bu jonli 1C/Didox API ulanishi degani emas.']
 ];
 return '<div class="panel program-guide"><h2>📗 Dastur bo‘yicha qo‘llanma '+helpBadge('Bo‘limlar, jarayonlar va mavjud cheklovlar haqida qisqa ma’lumot')+'</h2><p class="muted">Bo‘limlar ichidagi sariq ? belgisini bosing — tegishli izoh ochiladi.</p><div class="guide-grid">'+sections.map((x,i)=>'<div class="guide-item"><div><strong>'+x[0]+' '+esc(x[1])+'</strong> '+helpBadge(x[2])+'</div><p>'+esc(x[2])+'</p><button type="button" class="secondary" onclick="active='+i+';render()">Bo‘limga o‘tish</button></div>').join('')+'</div><h3>Asosiy ish tartibi</h3><div class="guide-grid">'+steps.map(x=>'<div class="guide-item"><strong>'+esc(x[0])+'</strong><p>'+esc(x[1])+'</p></div>').join('')+'</div></div>';
}
let active=0;let editingSupplier=null;const key='solishtiruv2_demo_data';let records=JSON.parse(localStorage.getItem(key)||'{}');const save=()=>{const copy={...records};delete copy[3];localStorage.setItem(key,JSON.stringify(copy))};
function uprDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('solishtiruv2_upr',2);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data');if(!req.result.objectStoreNames.contains('barcodes'))req.result.createObjectStore('barcodes')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

function didoxBarcodeStages(l){
 const original=String(l.bar||l.barcode||'').trim();
 const name=String(l.nm||'').trim(),mxik=String(l.mxik||'').trim();
 const override=tasnifMatches[JSON.stringify([name,mxik,original])]||tasnifMatches[JSON.stringify([name,mxik,''])];
 if(override?.manual&&tasnifBarcode13(override.barcode))return {code:String(override.barcode),source:'Qo‘lda tuzatilgan'};
 if(tasnifBarcode13(original))return {code:original,source:'Didox'};

 const soliq=tasnifSoliqValidCodes(mxik);
 if(soliq.length===1)return {code:soliq[0],source:'Soliq MXIK'};
 if(soliq.length>1)return {code:'',source:'Soliq MXIK: bir nechta kod, tekshirish kerak',ambiguous:true};
 const saved=tasnifMatches[JSON.stringify([name,mxik,original])]||tasnifMatches[JSON.stringify([name,mxik,''])];
 const code=typeof saved==='string'?saved:String(saved?.barcode||'').trim();
 if(tasnifBarcode13(code))return {code,source:'Nomenklatura mosligi'};
 // UPRga aylantirilgan nom katalogdagi aniq nom bilan teng bo‘lsa,
 // faqat yagona 13 xonali shtrix-kodni avtomatik qabul qilamiz.
 const byName=didoxBarcodeNameIndex();
 const exact=byName.get(tasnifNameKey(tasnifUprStyleName(name)))||byName.get(tasnifNameKey(name));
 const codes=(exact?.codes||[]).filter(tasnifBarcode13);
 if(codes.length===1)return {code:codes[0],source:'UPR nomi orqali avtomatik'};
 return {code:'',source:'Nomenklatura solishtirish kerak'};
}
function didoxLinkedBarcode(l){

 if(stage.code||stage.ambiguous)return stage.code;
 const original=String(l.bar||l.barcode||'').trim(),name=String(l.nm||'').trim(),mxik=String(l.mxik||'').trim();
 const saved=tasnifMatches[JSON.stringify([name,mxik,original])]||tasnifMatches[JSON.stringify([name,mxik,''])];
 const savedCode=typeof saved==='string'?saved:String(saved?.barcode||'').trim();
 const catalog=didoxBarcodeCatalog();
 const byName=didoxBarcodeNameIndex();
 const mapped=ehfMappings[[String(l._supplierInn||''),mxik,ehfNormalize(name)].join('|')];
 if(mapped){
  const upr=(records[3]||[]).find(x=>String(x.tovarId||'')===String(mapped.id||'')&&String(x.variantCode||'')===String(mapped.pc||''));
  const match=upr&&byName.get(tasnifNameKey(upr.product));
  if(match?.codes.length===1)return match.codes[0];
 }
 const chosen=typeof saved==='object'&&saved?.uprName?byName.get(tasnifNameKey(saved.uprName)):null;
 if(tasnifBarcode13(savedCode)&&chosen?.codes.includes(savedCode))return savedCode;
 if(chosen?.codes.length===1&&tasnifBarcode13(chosen.codes[0]))return chosen.codes[0];
 const exact=byName.get(tasnifNameKey(name))||byName.get(tasnifNameKey(tasnifUprStyleName(name)));
 if(exact?.codes.length===1&&tasnifBarcode13(exact.codes[0]))return exact.codes[0];
 const phone=tasnifPhoneCandidate(name,catalog);
 if(phone?.item?.codes.length===1&&tasnifBarcode13(phone.item.codes[0]))return phone.item.codes[0];
 const candidate=tasnifBarcodeNameCandidate(tasnifUprStyleName(name),catalog)||tasnifBarcodeNameCandidate(name,catalog);
 return candidate?.score>=0.8&&candidate?.item?.codes.length===1&&tasnifBarcode13(candidate.item.codes[0])?candidate.item.codes[0]:'';
}

function tasnifBarcodeNameCandidate(name,catalog){

function tasnifAutoUprCandidate(name,catalog){

 const meaningful=tokens.filter(t=>t!==memory&&!['pro','plus','max','ultra','dekor','burchakli'].includes(t));

 const pools=anchors.map(t=>prepared.byToken.get(t)||[]).filter(list=>list.length);
 if(!pools.length)return null;
 const candidates=pools.sort((x,y)=>x.length-y.length)[0];

 for(const entry of candidates){
  const {item,tokenSet,dimension:od,memory:om,color:oc}=entry;
  if(dimension&&od&&dimension!==od)continue;
  if(memory&&om&&memory!==om)continue;
  if(color&&oc&&color!==oc)continue;
  if(isPhone){
   if(normalizedPhoneBrand(item.name)!==brand)continue;
   if(modelTokens.length&&!modelTokens.every(t=>tokenSet.has(t)))continue;
   if(memory&&om!==memory)continue;
   if(color&&oc!==color)continue;
   if(['pro','plus','ultra','max'].some(q=>tokens.includes(q)!==tokenSet.has(q)))continue;
  }
  const common=tokens.filter(t=>tokenSet.has(t)).length;
  const union=new Set([...tokens,...entry.tokens]).size;

  if(/^\d{1,12}$/.test(String(x.barcode||'').trim()))return true;

 }).map(x=>{
  const key=JSON.stringify([x.name,x.mxik,x.barcode]),nameKey=tasnifNameKey(x.name);

  if(!cache.has(nameKey)){
   // Aniq UPR nomi mavjud bo‘lsa taxminiy qidiruvga o'tmasdan shu nomning kodini olamiz.

    cache.set(nameKey,{barcode:phone?.item?.codes?.length===1?{...phone,barcode:phone.item.codes[0]}:tasnifBarcodeNameCandidate(normalizedName,catalog)||tasnifBarcodeNameCandidate(x.name,catalog),name:phone?.item||tasnifAutoUprCandidate(normalizedName,catalog)||tasnifAutoUprCandidate(x.name,catalog)});

   tasnifMatches[key]={...(typeof saved==='object'&&saved?saved:{}),uprName:chosen.name,...(safeBarcode?{barcode:safeBarcode}:{})};
   tasnifMatchAutoDirty=true;
  }
  return {...x,key,uprStyleName:tasnifUprStyleName(x.name),uprName:chosen?.name||'',uprCodes:chosen?.codes||[],effectiveBarcode:safeBarcode,matchPercent:found.barcode&&found.barcode.item?.key===chosen?.key?Math.round(found.barcode.score*100):null,status:safeBarcode?'matched':chosen?'manual':'missing',exact:!!exact,auto:!!chosen&&!savedUpr&&!exact};
 });

 // Shtrix-kodi ishonchli biriktirilgan mahsulot ishchi ro‘yxatda qolmasin.

}

async function tasnifSoliqImport(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  if(typeof XLSX==='undefined')throw Error('Excel o‘qish moduli yuklanmagan.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];
  const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
  const norm=x=>String(x||'').toLocaleLowerCase().replace(/[\s_\-()]/g,'');
  let header=-1,ni=-1,mi=-1,bi=-1;
  for(let i=0;i<Math.min(matrix.length,25);i++){
   const cells=(matrix[i]||[]).map(norm);
   const m=cells.findIndex(v=>v.includes('mxik')||v.includes('икпу')||v.includes('мхик')||v==='ikpu');
   const n=cells.findIndex(v=>v.includes('nomi')||v.includes('mahsulot')||v.includes('наименование')||v.includes('номенклатура')||v.includes('товар'));
   const b=cells.findIndex(v=>v.includes('shtrix')||v.includes('штрих')||v.includes('barcode')||v.includes('gtin')||v.includes('ean'));
   if(m>=0&&(n>=0||b>=0)){header=i;mi=m;ni=n;bi=b;break}
  }
  if(header<0||bi<0)throw Error('Excel faylda MXIK KODI va SHTRIX KODI ustunlari bo‘lishi kerak.');
  const map=new Map(tasnifSoliq.map(x=>[JSON.stringify([x.mxik,x.barcode]),x]));
  let added=0;
  for(const cells of matrix.slice(header+1)){
   const x={name:ni>=0?String(cells[ni]||'').trim():'',mxik:String(cells[mi]||'').trim(),barcode:bi>=0?String(cells[bi]||'').trim():''};
   if(!x.mxik||!x.barcode)continue;
   const key=JSON.stringify([x.mxik,x.barcode]);if(!map.has(key))added++;map.set(key,x);
  }
  if(!added&&!map.size)throw Error('Mos keladigan ma’lumot qatori topilmadi.');
  const nextRows=[...map.values()];await tasnifSoliqSave(nextRows);tasnifSoliq=nextRows;tasnifSoliqIndex();try{localStorage.removeItem(tasnifSoliqKey)}catch(_){}
  tasnifSoliqDraw();alert('Soliq ma’lumotnomasi yangilandi. Yangi yozuvlar: '+added+'. Jami: '+tasnifSoliq.length);
 }catch(err){alert('Fayl yuklanmadi: '+err.message)}finally{e.target.value=''}
}

}

 const from=Number(el.style.getPropertyValue('--pct'))||0,t0=performance.now();

let barcodeRows=[],barcodeIndex=new Map(),barcodeFilter='all',barcodeQuery='',barcodeShowSku=false,barcodeShowAllNames=false;
function barcodeKey(v){return String(v??'').normalize('NFKC').toUpperCase().replace(/[\s\u200B-\u200D\uFEFF]/g,'').replace(/[‐‑‒–—−]/g,'-')}
function barcodeNameIndex(){const byPc=new Map(),byId=new Map();for(const x of records[3]||[]){const pc=barcodeKey(x.variantCode),id=String(x.tovarId??'').trim(),name=String(x.product??'').trim();if(!name)continue;if(pc){if(!byPc.has(pc))byPc.set(pc,new Set());byPc.get(pc).add(name)}if(id){if(!byId.has(id))byId.set(id,new Set());byId.get(id).add(name)}}const unique=values=>values&&values.size===1?[...values][0]:'';return {byPc,byId,unique}}
function rebuildBarcodeIndex(){barcodeIndex=new Map();for(const row of barcodeRows){const k=barcodeKey(row.pc);if(!k)continue;if(!barcodeIndex.has(k))barcodeIndex.set(k,new Set());if(row.barcode)barcodeIndex.get(k).add(String(row.barcode))}}
function barcodeMatch(pc){const codes=barcodeIndex.get(barcodeKey(pc));if(!codes||!codes.size)return {status:'missing',barcode:''};if(codes.size>1)return {status:'conflict',barcode:''};return {status:'linked',barcode:[...codes][0]}}
function barcodeDisplay(row){

 // PC kod bo‘yicha qo‘lda saqlangan shtrix-kod ustuvor; eski import qiymati uni bosib ketmaydi.
 if(m.status==='linked')return m.barcode;
 if(m.status==='conflict')return 'Tekshirish kerak';

}

function barcodeViewRows(){const names=barcodeNameIndex(),keys=new Set([...barcodeIndex.keys(),...(records[3]||[]).map(x=>barcodeKey(x.variantCode)).filter(Boolean)]),first=new Map();for(const x of barcodeRows){const k=barcodeKey(x.pc);if(!first.has(k))first.set(k,x)}return [...keys].map(k=>{const r=first.get(k)||{},m=barcodeMatch(k);return {pc:r.pc||k,name:names.unique(names.byPc.get(k))||names.unique(names.byId.get(String(r.tovarId??'').trim()))||'—',sku:r.sku||'',barcode:m.barcode,status:m.status,codes:[...(barcodeIndex.get(k)||[])],tovarId:r.tovarId||''}})}

async function editBarcode(item){
 if(!item)return;
 const value=prompt('PC kod: '+item.pc+'\nTovar: '+(item.name==='—'?item.sku||'Nomi topilmadi':item.name)+'\nShtrix-kodni kiriting (bo‘sh qoldirish — bekor qilish):',item.status==='linked'?item.barcode:'');

 const code=value.trim();
 if(!code)return;
 if(!/^[A-Za-z0-9-]{4,64}$/.test(code)){alert('Shtrix-kod 4–64 belgidan iborat bo‘lishi, faqat harf, raqam yoki chiziqcha qatnashishi kerak.');return}
 const key=barcodeKey(item.pc);
 const old=barcodeRows;
 const matching=old.filter(x=>barcodeKey(x.pc)===key);
 const other=old.filter(x=>barcodeKey(x.pc)!==key);
 const newRow={tovarId:item.tovarId||matching[0]?.tovarId||'',pc:item.pc,sku:item.sku||matching[0]?.sku||'',barcode:code,manual:true};
 if(matching.some(x=>x.barcode&&x.barcode!==code)&&!confirm('Bu PC kodda boshqa shtrix-kod mavjud. Avvalgi bog‘lanish almashtirilsinmi?'))return;
 barcodeRows=[...other,newRow];rebuildBarcodeIndex();
 try{await barcodeStore(barcodeRows);drawBarcodeTable();if(active===3)drawRows();alert('Shtrix-kod saqlandi. UPR Kirimda ham shu PC kod bo‘yicha avtomatik aks etadi.')}catch(err){barcodeRows=old;rebuildBarcodeIndex();alert('Saqlashda xato: '+err.message)}
}
async function importBarcodes(e){const file=e.target.files?.[0];if(!file)return;const status=document.getElementById('barcodeStatus');try{if(typeof XLSX==='undefined')throw Error('Excel o‘qish kutubxonasi yuklanmadi');status.textContent='Excel o‘qilmoqda...';const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),aliases=[['tovar_id'],['tovar_kodi'],['sku'],['shtrix_code']],norm=x=>String(x??'').trim().toLowerCase(),newRows=[];let skipped=0,found=false;for(const sheet of wb.SheetNames){const matrix=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:false});const h=matrix.findIndex(row=>aliases.every(group=>row.some(cell=>group.includes(norm(cell)))));if(h<0)continue;found=true;const idx=aliases.map(group=>matrix[h].findIndex(cell=>group.includes(norm(cell))));for(const row of matrix.slice(h+1)){if(row.every(v=>!String(v??'').trim()))continue;const v=idx.map(i=>String(row[i]??'').trim());if(!v[1]){skipped++;continue}newRows.push({tovarId:v[0],pc:v[1],sku:v[2],barcode:v[3]})}}if(!found)throw Error('tovar_id, tovar_kodi, sku, shtrix_code sarlavhalari topilmadi');if(!newRows.length)throw Error('Yaroqli PC kodli qatorlar topilmadi');const old=barcodeRows;barcodeRows=newRows.concat(old.filter(x=>x.manual===true));rebuildBarcodeIndex();try{await barcodeStore(barcodeRows)}catch(err){barcodeRows=old;rebuildBarcodeIndex();throw Error('Saqlashda xato: '+err.message)}status.textContent=file.name+': '+newRows.length+' qator yuklandi, '+skipped+' qator o‘tkazildi. Oldingi shtrix-kodlar ro‘yxati almashtirildi.';drawBarcodeTable()}catch(err){status.textContent='Import xatosi: '+err.message}finally{e.target.value=''}}

function uprGeneratedBarcode(row){

}

 const used=barcodeRows.some(x=>String(x.barcode??'')===code&&barcodeKey(x.pc)!==pc)
  ||(records[3]||[]).some(x=>String(x.barcode??'')===code&&barcodeKey(x.variantCode)!==pc);
 if(used)return 'Bu shtrix-kod boshqa PC variantga biriktirilgan.';
 return '';
}

async function importStoreCompanyExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 const status=document.getElementById('storeCompanyMessage');
 try{
 if(typeof XLSX==='undefined')throw Error('Excel kutubxonasi yuklanmadi');
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),norm=x=>String(x??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[\s_-]/g,'');
 const columns=['organizationid','organizationname','mchj','inn','type'];
 const incoming=[];let invalid=0,matched=false;
 for(const sheet of wb.SheetNames){
 const data=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:false});
 const header=data.findIndex(row=>columns.every(c=>row.some(v=>norm(v)===c)));if(header<0)continue;matched=true;
 const indexes=columns.map(c=>data[header].findIndex(v=>norm(v)===c));
 for(const line of data.slice(header+1)){
 if(line.every(v=>!String(v??'').trim()))continue;
 const [storeId,storeName,company,inn,type]=indexes.map(i=>String(line[i]??'').trim());
 if(!storeId||!storeName||!company||!inn||!type){invalid++;continue}
 incoming.push({storeId,storeName,company,inn,type});
 }
 }
 if(!matched)throw Error('OrganizationId, OrganizationName, MCHJ, INN, Type sarlavhalari topilmadi');
 if(!incoming.length)throw Error('Yaroqli bog‘lanish qatorlari topilmadi');
 const current=storeCompanyRows(),map=new Map(current.map(x=>[storeCompanyKey(x),x]));let added=0,updated=0;
 for(const row of incoming){const key=storeCompanyKey(row);if(map.has(key))updated++;else added++;map.set(key,row)}
 const types=storeCompanyActivities(),typeMap=new Map(types.map(t=>[t.toLocaleLowerCase(),t]));for(const row of incoming)if(!typeMap.has(row.type.toLocaleLowerCase()))typeMap.set(row.type.toLocaleLowerCase(),row.type);
 records.storeCompanies=[...map.values()];records.activityTypes=[...typeMap.values()];
 try{save()}catch(err){records.storeCompanies=current;records.activityTypes=types;throw Error('Brauzer xotirasida joy yetarli emas: '+err.message)}
 storeCompanyNotice=file.name+': '+added+' ta yangi bog‘lanish, '+updated+' ta mavjud bog‘lanish yangilandi, '+invalid+' ta noto‘liq qator o‘tkazildi.';
 drawStoreCompanyTable();
 document.getElementById('storeCompanyMessage').textContent=file.name+': '+added+' ta yangi bog‘lanish, '+updated+' ta mavjud bog‘lanish yangilandi, '+invalid+' ta noto‘liq qator o‘tkazildi.';
 }catch(err){status.textContent='Import xatosi: '+err.message}finally{e.target.value=''}
}

function supplierEntityNameKey(v){
 return String(v??'').normalize('NFKC').toLocaleLowerCase()
  .replace(/[“”«»"'’‘ʻ`]/g,' ')
  .replace(/[.,;:()\[\]{}]/g,' ')
  .replace(/\b(mchj|мчж|ooo|ооо)\b/g,' ')
  .replace(/[^a-zа-яё0-9]+/gi,' ')
  .replace(/\s+/g,' ').trim();
}
function supplierInnKnowledge(extraRows=[]){
 const map=new Map();
 const add=(name,inn)=>{
  const key=supplierEntityNameKey(name),code=String(inn??'').trim().replace(/\D/g,'');
  if(!key||!/^\d{9}$/.test(code))return;
  if(!map.has(key))map.set(key,new Set());
  map.get(key).add(code);
 };
 supplierEntities().forEach(x=>add(x.name,x.inn));
 extraRows.forEach(x=>add(x.entity??x.name,x.inn));
 return map;
}
function supplierPropagateInns(extraRows=[],shouldSave=true){
 const knowledge=supplierInnKnowledge(extraRows);
 let filled=0,conflicts=0,unknown=0;
 for(const x of supplierEntities()){
  if(String(x.inn||'').trim())continue;
  const key=supplierEntityNameKey(x.name),codes=knowledge.get(key);
  if(codes?.size===1){x.inn=[...codes][0];filled++}
  else if(codes?.size>1)conflicts++;
  else unknown++;
 }
 if(shouldSave&&filled){save()}
 return {filled,conflicts,unknown};
}

}

opish">×</button><div class="supplier-dialog-inner"><h3 id="supplierDialogTitle">Ta’minotchi va uning korxonalari</h3><form id="supplierForm"><div class="toolbar"><input name="name" placeholder="MAIN ta’minotchi nomi" required style="min-width:280px"><input name="phone" placeholder="Telefon"><input name="note" placeholder="Izoh"></div><h4>Biriktirilgan MCHJlar</h4><div id="supplierEntityInputs"></div><div class="toolbar"><button type="button" class="secondary" id="addSupplierEntity">+ Yana MCHJ qo‘shish</button><button class="primary" type="submit">Ta’minotchi va MCHJlarni saqlash</button><button class="secondary" type="button" id="cancelSupplier">Bekor qilish</button></div></form><div class="notice">Bitta MAIN ta’minotchisiga bir nechta MCHJ biriktirish mumkin. STIR ixtiyoriy. MCHJ nomi kiritilmagan bo‘sh qatorlar saqlanmaydi.</div></div></dialog><dialog id="supplierViewDialog" class="supplier-dialog"><button type="button" class="supplier-dialog-close" onclick="document.getElementById('supplierViewDialog').close()" aria-label="Yopish">×</button><div id="supplierViewContent"></div><div class="toolbar"><button type="button" class="secondary" onclick="document.getElementById('supplierViewDialog').close()">Yopish</button></div></dialog>`}

function addSupplierEntityRow(name='',inn='',note=''){const area=document.getElementById('supplierEntityInputs');if(!area)return;const row=document.createElement('div');row.className='toolbar supplier-entity-row';row.innerHTML='<input class="entity-name" placeholder="MCHJ to‘liq nomi" style="min-width:280px"><input class="entity-inn" placeholder="STIR (ixtiyoriy, 9 raqam)" inputmode="numeric" pattern="[0-9]{9}"><input class="entity-note" placeholder="Izoh"><button type="button" class="secondary">Olib tashlash</button>';row.querySelector('.entity-name').value=name;row.querySelector('.entity-inn').value=inn;row.querySelector('.entity-note').value=note;row.querySelector('button').onclick=()=>row.remove();area.appendChild(row)}
function openNewSupplier(){editingSupplier=null;document.getElementById('supplierForm').reset();document.getElementById('supplierEntityInputs').innerHTML='';addSupplierEntityRow();document.getElementById('supplierDialogTitle').textContent='Yangi ta’minotchi va korxonalari';document.getElementById('supplierDialog').showModal()}
function bindSuppliers(){document.getElementById('newSupplier').onclick=openNewSupplier;document.getElementById('closeSupplierDialog').onclick=()=>document.getElementById('supplierDialog').close();document.getElementById('addSupplierEntity').onclick=()=>addSupplierEntityRow();document.getElementById('supplierForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;const norm=x=>String(x||'').trim().toLocaleLowerCase();if(suppliers().some(x=>norm(x.name)===norm(name)&&x.id!==editingSupplier)){alert('Bu MAIN ta’minotchisi allaqachon mavjud');return}const rows=[...document.querySelectorAll('.supplier-entity-row')].map(row=>({name:row.querySelector('.entity-name').value.trim(),inn:row.querySelector('.entity-inn').value.trim(),note:row.querySelector('.entity-note').value.trim()})).filter(x=>x.name);const seen=new Set();for(const x of rows){if(x.inn&&!/^\d{9}$/.test(x.inn)){alert('STIR kiritilsa 9 ta raqam bo‘lishi kerak');return}const k=x.inn?'inn:'+x.inn:'name:'+norm(x.name);if(seen.has(k)){alert('Bir xil MCHJ takror kiritilgan');return}seen.add(k)}let id=editingSupplier;if(id){let x=suppliers().find(x=>x.id===id);if(!x)return;Object.assign(x,{name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}else{id=crypto.randomUUID();(records.suppliers??=[]).push({id,name,phone:String(f.get('phone')||''),note:String(f.get('note')||'')})}records.supplierEntities=supplierEntities().filter(x=>x.supplierId!==id);for(const x of rows)records.supplierEntities.push({id:crypto.randomUUID(),supplierId:id,...x});editingSupplier=null;save();document.getElementById('supplierDialog').close();render()};document.getElementById('cancelSupplier').onclick=()=>{editingSupplier=null;document.getElementById('supplierDialog').close()};addSupplierEntityRow();
document.getElementById('supplierAutoInn').onclick=supplierAutoFillInns;document.getElementById('supplierSearch').oninput=drawSuppliers;document.getElementById('supplierExcel').onchange=e=>{const f=e.target.files?.[0];if(f){const n=document.getElementById('supplierFileName');n.textContent='Tanlangan fayl: '+f.name;n.classList.remove('hidden')}importSupplierExcel(e)};document.getElementById('supplierHelpToggle').onclick=()=>document.getElementById('supplierHelp').classList.toggle('hidden');document.getElementById('supplierMoreToggle').onclick=()=>document.getElementById('supplierMoreMenu').classList.toggle('hidden');document.getElementById('supplierTemplate').onclick=()=>downloadData('taminotchilar_namuna.csv','\uFEFFTaminotchi,MCHJ nomi,STIR\r\nАртел спец проект,,\r\nTrade,Trade MCHJ,123456789\r\nTrade,Trade Savdo MCHJ,987654321','text/csv;charset=utf-8');document.getElementById('exportSupplierCsv').onclick=()=>{const rows=[['Taminotchi','MCHJ nomi','STIR']];for(const x of suppliers()){const entities=supplierEntities().filter(y=>y.supplierId===x.id);if(!entities.length)rows.push([x.name,'','']);else for(const y of entities)rows.push([x.name,y.name,y.inn||'']);}const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadData('taminotchilar.csv',csv,'text/csv;charset=utf-8')};document.getElementById('exportSuppliers').onclick=()=>downloadData('taminotchilar_zaxira.json',JSON.stringify({suppliers:suppliers(),supplierEntities:supplierEntities()},null,2),'application/json');document.getElementById('importSuppliers').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.suppliers)||!Array.isArray(d.supplierEntities))throw Error('Noto‘g‘ri fayl');if(!confirm('Joriy ta’minotchilar ma’lumotlari importdagi ma’lumotlar bilan almashtirilsinmi?'))return;records.suppliers=d.suppliers;records.supplierEntities=d.supplierEntities;save();render()}catch(err){alert('Import xatosi: '+err.message)}};drawSuppliers()}

async function importSupplierExcel(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  let rows=[];
  if(/\.csv$/i.test(file.name)){
   const txt=(await file.text()).replace(/^\uFEFF/,'');
   const first=txt.split(/\r?\n/)[0]||'';
   const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
   rows=txt.split(/\r?\n/).filter(x=>x.trim()).map(line=>sep===','?parseCSV(line):line.split(';').map(x=>x.trim().replace(/^"|"$/g,'')));
  }else{
   if(typeof XLSX==='undefined')throw Error('Excel kutubxonasi yuklanmadi. CSV formatidan foydalaning.');
   const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
   rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
  }
  const norm=x=>String(x??'').trim().toLocaleLowerCase().replace(/[’‘ʻ`']/g,'').replace(/\s+/g,' ');
  const isSupplier=x=>['taminotchi','ta minotchi','main taminotchi nomi'].includes(norm(x));
  const isEntity=x=>['mchj nomi','yuridik korxona nomi','mchj'].includes(norm(x));
  const isInn=x=>['stir','inn','iin','инн','стир','mchj stir','korxona stir','soliq raqami','идентификационный номер налогоплательщика'].includes(norm(x));
  const headerAt=rows.findIndex(row=>row.some(isSupplier)&&row.some(isEntity));
  if(headerAt<0)throw Error('Ta’minotchi va MCHJ nomi ustunlari topilmadi.');
  const head=rows[headerAt],si=head.findIndex(isSupplier),mi=head.findIndex(isEntity);let ii=head.findIndex(isInn);if(ii<0&&head.length>=3&&si!==2&&mi!==2)ii=2;if(ii<0)throw Error('STIR/INN ustuni topilmadi. Uchinchi ustunni STIR yoki ИНН deb nomlang.');
  const incoming=rows.slice(headerAt+1).filter(row=>String(row[si]??'').trim()).map(row=>({name:String(row[si]).trim(),entity:String(row[mi]??'').trim(),inn:String(row[ii]??'').trim().replace(/[\s\u00a0]/g,'').replace(/\.0$/,'')}));
  // Faylning o‘zida yoki mavjud bazada ayni MCHJ nomi uchun bitta aniq STIR bo‘lsa, bo‘sh STIRni avtomatik to‘ldiramiz.
  const innKnowledge=supplierInnKnowledge(incoming);
  let autoFromName=0;
  for(const row of incoming){
   if(row.inn||!row.entity)continue;
   const codes=innKnowledge.get(supplierEntityNameKey(row.entity));
   if(codes?.size===1){row.inn=[...codes][0];autoFromName++}
  }
  if(!incoming.length)throw Error('Import uchun ma’lumot topilmadi.');
  if(!incoming.some(x=>x.inn))throw Error('Excel STIR ustunida hech qanday raqam topilmadi. Uchinchi ustunni tekshiring.');
  for(const row of incoming)if(row.inn&&!/^\d{9}$/.test(row.inn))throw Error(row.name+' / '+row.entity+': STIR 9 ta raqamdan iborat bo‘lishi kerak ('+row.inn+').');
  if(!confirm(incoming.length+' ta qator topildi. Mavjud STIRlarni saqlagan holda yangi bog‘lanishlar qo‘shilsinmi?'))return;
  let newS=0,newE=0,updated=0,duplicates=0,conflicts=0;
  for(const row of incoming){
   let supplier=suppliers().find(x=>norm(x.name)===norm(row.name));
   if(!supplier){supplier={id:crypto.randomUUID(),name:row.name,phone:'',note:''};(records.suppliers??=[]).push(supplier);newS++}
   if(!row.entity&&!row.inn)continue;
   const entities=supplierEntities();
   // Bir STIR bir nechta MAIN ta’minotchisiga biriktirilishi mumkin.
   // Dublikat faqat ayni MAIN ta’minotchi doirasida tekshiriladi.
   let existing=entities.find(x=>x.supplierId===supplier.id&&row.inn&&String(x.inn||'').trim()===row.inn)||entities.find(x=>x.supplierId===supplier.id&&norm(x.name)===norm(row.entity));
   if(existing){
    if(row.inn&&existing.inn&&String(existing.inn)!==row.inn){conflicts++;continue}
    if(row.inn&&!existing.inn){existing.inn=row.inn;updated++}else duplicates++;
    if(row.entity&&!existing.name)existing.name=row.entity;
   }else if(row.entity){
    (records.supplierEntities??=[]).push({id:crypto.randomUUID(),supplierId:supplier.id,name:row.entity,inn:row.inn,note:'Excel import'});newE++;
   }
  }
  const propagated=supplierPropagateInns(incoming,false);
  save();render();
  alert('Import yakunlandi. Yangi ta’minotchilar: '+newS+'; yangi MCHJ bog‘lanishlari: '+newE+'; importda STIR to‘ldirildi: '+updated+'; nom bo‘yicha avtomatik: '+(autoFromName+propagated.filled)+'; mavjud: '+duplicates+'; STIR ziddiyatlari: '+(conflicts+propagated.conflicts)+'. Bir xil MCHJ nomida yagona STIR topilsa, bo‘sh joylarga avtomatik qo‘yiladi.');
 }catch(err){alert('Excel import xatosi: '+err.message)}
 finally{e.target.value=''}
}

function drawSuppliers(){supplierPropagateInns([],true);let q=(document.getElementById('supplierSearch')?.value||'').toLowerCase();let a=suppliers().filter(x=>(x.name+' '+(x.phone||'')+' '+supplierEntities().filter(y=>y.supplierId===x.id).map(y=>y.name+' '+y.inn).join(' ')).toLowerCase().includes(q));document.getElementById('supplierRows').innerHTML=`<div style="overflow:auto"><table><thead><tr><th>MAIN ta’minotchi nomi</th><th>Yuridik korxona nomi (MCHJ)</th><th>STIR</th><th>Telefon / izoh</th><th style="width:110px">Amallar</th></tr></thead><tbody>${a.map(x=>`<tr><td><button type="button" class="supplier-name-link" onclick="editSupplier('${x.id}')">${esc(x.name)}</button></td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.name||'—')}</div>`).join('')||'<span class="muted">Biriktirilmagan</span>'}</td><td>${supplierEntities().filter(y=>y.supplierId===x.id).map(y=>`<div style="margin:4px 0">${esc(y.inn||'—')}</div>`).join('')||'—'}</td><td>${esc(x.phone||'')}<div class="muted">${esc(x.note||'')}</div></td><td><div class="supplier-actions"><button type="button" class="supplier-icon-button" title="Korxonalarni ko‘rish" aria-label="Ko‘rish" onclick="viewSupplier('${x.id}')">👁</button><button type="button" class="supplier-icon-button" title="Ta’minotchi va MCHJlarni tahrirlash" aria-label="Tahrirlash" onclick="editSupplier('${x.id}')">✎</button></div></td></tr>`).join('')}</tbody></table></div><p class="muted">Ko‘rsatilmoqda: ${a.length} ta ta’minotchi</p>`}
function viewSupplier(id){const x=suppliers().find(y=>y.id===id);if(!x)return;const entities=supplierEntities().filter(y=>y.supplierId===id);const dlg=document.getElementById('supplierViewDialog');const root=document.getElementById('supplierViewContent');root.innerHTML='<h3>'+esc(x.name)+'</h3><p><b>Telefon:</b> '+esc(x.phone||'—')+' &nbsp; <b>Izoh:</b> '+esc(x.note||'—')+'</p><h4>Biriktirilgan korxonalar ('+entities.length+')</h4>'+(entities.length?'<table><thead><tr><th>MCHJ nomi</th><th>STIR</th><th>Izoh</th></tr></thead><tbody>'+entities.map(y=>'<tr><td>'+esc(y.name)+'</td><td>'+esc(y.inn||'—')+'</td><td>'+esc(y.note||'—')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">Hozircha MCHJ biriktirilmagan.</p>');dlg.showModal()}
function editSupplier(id){let x=suppliers().find(x=>x.id===id);if(!x)return;editingSupplier=id;let f=document.getElementById('supplierForm');f.elements.name.value=x.name;f.elements.phone.value=x.phone||'';f.elements.note.value=x.note||'';document.getElementById('supplierEntityInputs').innerHTML='';const entities=supplierEntities().filter(y=>y.supplierId===id);if(entities.length)entities.forEach(y=>addSupplierEntityRow(y.name,y.inn||'',y.note||''));else addSupplierEntityRow();document.getElementById('supplierDialogTitle').textContent='Ta’minotchi: '+x.name;document.getElementById('supplierDialog').showModal()}
function editEntity(id){let y=supplierEntities().find(x=>x.id===id);if(!y)return;let name=prompt('MCHJ nomi:',y.name);if(name===null)return;name=name.trim();if(!name){alert('MCHJ nomi bo‘sh bo‘lmasin');return}let inn=prompt('STIR (ixtiyoriy, 9 raqam):',y.inn||'');if(inn===null)return;inn=inn.trim();if(inn&&!/^\d{9}$/.test(inn)){alert('STIR 9 ta raqam bo‘lishi kerak');return}if(supplierEntities().some(x=>x.id!==id&&x.supplierId===y.supplierId&&((inn&&x.inn===inn)||(!inn&&x.name.trim().toLowerCase()===name.toLowerCase())))){alert('Bu MCHJ allaqachon biriktirilgan');return}y.name=name;y.inn=inn;save();drawSuppliers()}
function removeEntity(id){if(!confirm('Yuridik shaxs bog‘lanishini o‘chirasizmi?'))return;records.supplierEntities=supplierEntities().filter(x=>x.id!==id);save();drawSuppliers()}
function removeSupplier(id){if(supplierEntities().some(x=>x.supplierId===id)){alert('Avval biriktirilgan yuridik shaxslarni ajrating');return}if(!confirm('Ta’minotchini o‘chirasizmi?'))return;records.suppliers=suppliers().filter(x=>x.id!==id);save();render()}
function downloadData(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

render();
tasnifSoliqLoad();
uprLoad();
barcodeLoad();
</script></body></html>
